<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b5bdb">
<!-- 单文件版：可直接双击打开，也可发给同学 -->
<title>人工智能训练师 · 理论题库练习</title>
<meta name="description" content="2026 年广东省人工智能与机器人技能大赛（人工智能训练师赛项）官方初赛理论题库练习，共 1445 题，含答案、知识点与解析、随机出题、错题本与学习记录。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233b5bdb'/%3E%3Ctext x='32' y='44' font-size='30' font-family='Arial,Helvetica,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<style>

:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#0f172a; --ink-2:#475569; --ink-3:#94a3b8;
  --line:#e6eaf2; --brand:#3b5bdb; --brand-2:#5c7cfa; --brand-soft:#edf1ff;
  --ok:#16a34a; --ok-soft:#e8f7ee; --bad:#dc2626; --bad-soft:#fdeceb;
  --warn:#d97706; --warn-soft:#fff5e6; --radius:16px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  --shadow-lg:0 20px 50px rgba(15,23,42,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--brand);text-decoration:none}
::selection{background:#cfd9ff}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; backdrop-filter:blur(10px);
  background:rgba(255,255,255,.86); border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1180px; margin:0 auto; padding:10px 18px;
  display:flex; align-items:center; gap:14px; min-height:58px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;min-width:0;flex:1 1 auto}
.brand>div:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .logo{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--brand),#7c3aed);
  display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;
  box-shadow:0 4px 12px rgba(59,91,219,.35);
}
.brand small{display:block;font-weight:500;color:var(--ink-3);font-size:11px;letter-spacing:.4px}
.topbar .spacer{flex:0 0 auto}
.top-link{
  border:1px solid var(--line); background:#fff; color:var(--ink-2);
  padding:7px 12px; border-radius:10px; font-size:13px; display:inline-flex; gap:6px; align-items:center;
  transition:.15s; white-space:nowrap;
}
.top-link:hover{color:var(--brand);border-color:#c7d2fe;background:#f8faff}
.top-link.active{background:var(--brand-soft);border-color:#c7d2fe;color:var(--brand);font-weight:600}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 70px}
.view-enter{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- home ---------- */
.hero{
  position:relative; overflow:hidden; border-radius:22px; padding:30px 30px 26px;
  background:linear-gradient(120deg,#2b3fb8 0%,#3b5bdb 42%,#6d4bd8 100%);
  color:#fff; box-shadow:0 18px 40px rgba(43,63,184,.28);
}
.hero:after{
  content:""; position:absolute; right:-90px; top:-120px; width:320px; height:320px;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 62%); border-radius:50%;
}
.hero h1{margin:0 0 8px;font-size:26px;letter-spacing:.5px}
.hero p{margin:0;color:rgba(255,255,255,.82);font-size:13.5px}
.hero .hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.hero .chip{
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22);
  padding:6px 12px; border-radius:999px; font-size:12.5px; backdrop-filter:blur(4px);
}
.hero .hero-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.hero .btn-primary{background:#fff;color:#2b3fb8}
.hero .btn-primary:hover{background:#eef1ff}
.hero .btn-ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.hero .btn-ghost:hover{background:rgba(255,255,255,.22)}

.section-title{display:flex;align-items:baseline;gap:10px;margin:30px 2px 14px}
.section-title h2{margin:0;font-size:17px;letter-spacing:.3px}
.section-title span{color:var(--ink-3);font-size:12.5px}

.paper-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.paper-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);transition:.2s;display:flex;flex-direction:column;gap:14px;
  position:relative;overflow:hidden;
}
.paper-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#c7d2fe}
.paper-card .ribbon{
  position:absolute;top:14px;right:-32px;transform:rotate(38deg);
  background:var(--ok);color:#fff;font-size:11px;padding:4px 38px;letter-spacing:1px;
}
.paper-card h3{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.paper-card h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--brand)}
.paper-card .meta{color:var(--ink-3);font-size:12.5px;margin-top:-8px}
.paper-card .stat{
  display:flex;align-items:center;gap:12px;background:#f8faff;border:1px dashed #dbe3ff;
  padding:10px 12px;border-radius:12px;font-size:12.5px;color:var(--ink-2);
}
.paper-card .stat b{display:block;font-size:19px;color:var(--brand);font-weight:700;line-height:1.25}
.paper-card .stat span{font-size:11.5px;color:var(--ink-3)}
.paper-card .stat .sep{width:1px;height:26px;background:#dbe3ff}
.paper-card .ops{display:flex;gap:8px;margin-top:auto}
.paper-card .ops .btn{flex:1}

.btn{
  border:1px solid var(--line); background:#fff; color:var(--ink);
  padding:9px 14px; border-radius:11px; font-size:13.5px; font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:.16s; white-space:nowrap;
}
.btn:hover{border-color:#c7d2fe;background:#f8faff;color:var(--brand)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;
  box-shadow:0 6px 16px rgba(59,91,219,.28)}
.btn-primary:hover{background:#3450c9;border-color:#3450c9;color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.mini-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mini-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;cursor:pointer;transition:.18s;
}
.mini-card:hover{border-color:#c7d2fe;transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.mini-card .ico{
  width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:19px;
  background:var(--brand-soft);
}
.mini-card .ico.warn{background:var(--warn-soft)}
.mini-card .ico.ok{background:var(--ok-soft)}
.mini-card h4{margin:0;font-size:14.5px}
.mini-card p{margin:1px 0 0;color:var(--ink-3);font-size:12px}

.notice{
  display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;
  background:var(--warn-soft);border:1px solid #fde3bd;color:#8a5a10;font-size:12.8px;margin-top:16px;
}
.notice b{color:#7a4b06}
.notice.ok{background:#eefaf3;border-color:#bbf7d0;color:#0f7a3d}
.notice.ok b{color:#0b6b34}
.notice .x{margin-left:auto;background:none;border:0;color:#b07b2d;font-size:16px;line-height:1}

/* ---------- quiz ---------- */
.quiz-shell{padding-top:6px}
.quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.quiz-top .title{font-weight:700;font-size:16px}
.qtop-spacer{flex:1}
.qtop-actions{display:flex;gap:8px;align-items:center}
.tag{
  font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand);
  font-weight:700;letter-spacing:.3px;
}
.tag.gray{background:#eef1f7;color:var(--ink-2)}
.tag.judge{background:#eafaf0;color:#0f8a45}
.tag.multi{background:#fff1e6;color:#b45309}
.timer{
  margin-left:auto;display:flex;align-items:center;gap:7px;
  font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;color:var(--ink-2);
  background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:11px;box-shadow:var(--shadow);
}
.timer.warn{color:var(--bad);border-color:#fecaca;background:#fff5f5;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.62}}

.quiz-body{display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:18px;align-items:start}
.q-card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px 18px;
  box-shadow:var(--shadow);min-height:400px;min-width:0;
}
.q-head{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12.5px;margin-bottom:12px}
.q-head .num{color:var(--brand);font-weight:800;font-size:13px}
.q-head .fav{margin-left:auto;border:0;background:none;font-size:17px;line-height:1;color:#d7dce8;padding:2px}
.q-head .fav.on{color:#f59e0b}
.q-stem{
  font-size:17.5px;line-height:1.8;font-weight:600;color:#111827;margin:0 0 18px;
  white-space:pre-wrap;word-break:break-word;
}
.q-stem .blank{color:var(--brand)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:13px;
  border:1.5px solid var(--line);background:#fcfdff;cursor:pointer;transition:.14s;position:relative;
}
.opt:hover{border-color:#c7d2fe;background:#f6f9ff}
.opt .letter{
  width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
  font-size:13px;font-weight:800;background:#eef1f7;color:var(--ink-2);transition:.14s;
}
.opt .txt{flex:1;font-size:15px;color:#1f2937;word-break:break-word}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(59,91,219,.09)}
.opt.sel .letter{background:var(--brand);color:#fff}
.opt.correct{border-color:#86efac;background:var(--ok-soft)}
.opt.correct .letter{background:var(--ok);color:#fff}
.opt.wrong{border-color:#fca5a5;background:var(--bad-soft)}
.opt.wrong .letter{background:var(--bad);color:#fff}
.opt .mark{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ok);align-self:center}
.opt.wrong .mark{color:var(--bad)}

.feedback{
  margin-top:16px;border-radius:12px;padding:11px 14px;font-size:13.5px;display:flex;gap:8px;align-items:center;
  background:var(--ok-soft);color:#0f7a3d;border:1px solid #bbf7d0;
}
.feedback.bad{background:var(--bad-soft);color:#b91c1c;border-color:#fecaca}
.feedback.unknown{background:#eef2f7;color:var(--ink-2);border-color:#e2e8f0}

.q-foot{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:14px;border-top:1px dashed var(--line)}
.q-foot .spacer{flex:1}
.hint{color:var(--ink-3);font-size:12px}

/* answer card */
.side{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);
  position:sticky;top:76px;
}
.side h4{margin:0 0 10px;font-size:13.5px;display:flex;align-items:center;gap:6px}
.side h4 span{margin-left:auto;color:var(--ink-3);font-weight:500;font-size:12px}
.cards{display:block}
.card-group{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-bottom:14px}
.card-sep{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:11px;color:var(--ink-3);font-weight:600}
.card-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.cell{
  aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:#fbfcff;color:var(--ink-2);
  font-size:11.5px;font-weight:600;display:grid;place-items:center;padding:0;transition:.12s;
}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:var(--brand-soft);border-color:#c7d2fe;color:var(--brand)}
.cell.cur{outline:2px solid var(--brand);outline-offset:1px}
.cell.flag:after{
  content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--warn);
}
.cell{position:relative}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink-3)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.legend .l1{background:var(--brand-soft);border:1px solid #c7d2fe}
.legend .l2{background:#fff;border:1px solid var(--line)}
.legend .l3{background:var(--warn)}

.side .mini-info{display:flex;gap:8px;margin-top:14px;font-size:12px;color:var(--ink-2)}
.side .mini-info div{flex:1;background:#f8faff;border-radius:9px;padding:7px 8px;text-align:center}
.side .mini-info b{display:block;font-size:15px;color:var(--brand)}

/* ---------- result ---------- */
.result-hero{
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow);
  display:flex;gap:28px;align-items:center;flex-wrap:wrap;
}
.score-ring{position:relative;width:150px;height:150px;flex:none}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .val{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
}
.score-ring .val{flex-direction:column;display:flex;align-items:center;justify-content:center;gap:2px}
.score-ring .val b{font-size:36px;line-height:1;display:block;letter-spacing:-1px}
.score-ring .val span{font-size:11px;color:var(--ink-3)}
.result-main{flex:1;min-width:260px}
.result-main h1{margin:0 0 6px;font-size:22px}
.result-main .sub{color:var(--ink-3);font-size:13px}
.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.kpi{background:#f8faff;border:1px solid #e8edfb;border-radius:12px;padding:12px}
.kpi span{color:var(--ink-3);font-size:12px}
.kpi b{display:block;font-size:18px;margin-top:2px}

.review{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.rev-item{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  border-left:4px solid var(--ok);
}
.rev-item.bad{border-left-color:var(--bad)}
.rev-item .rh{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
.rev-item .rh .no{color:var(--ink);font-weight:700}
.rev-item .rs{font-size:14.5px;font-weight:600;margin-bottom:10px;white-space:pre-wrap}
.rev-item .ro{font-size:13.5px;color:var(--ink-2);margin:3px 0;display:flex;gap:8px}
.rev-item .ro b{font-weight:700;color:var(--ink)}
.rev-item .r-an{font-size:13px;color:var(--ink-2);background:var(--bg-soft,#f1f5f9);border-radius:8px;padding:8px 10px;margin:8px 0 2px;line-height:1.7;white-space:pre-wrap}
.ans-badge{font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:700}
.ans-badge.ok{background:var(--ok-soft);color:#0f7a3d}
.ans-badge.bad{background:var(--bad-soft);color:#b91c1c}
.ans-badge.mid{background:#eef2f7;color:var(--ink-2)}

/* ---------- misc ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 6px;font-size:17px}
.panel p.desc{color:var(--ink-2);font-size:13.5px;margin:0 0 16px}
textarea{
  width:100%;min-height:240px;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:ui-monospace,Consolas,monospace;
  font-size:13px;line-height:1.7;resize:vertical;background:#fcfdff;color:var(--ink);
}
textarea:focus{outline:none;border-color:#c7d2fe;box-shadow:0 0 0 3px rgba(59,91,219,.1)}
select{
  border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:13.5px;
}
.list{display:flex;flex-direction:column;gap:10px}
.row{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;
}
.row .grow{flex:1;min-width:0}
.row .qtext{font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .qsub{font-size:11.5px;color:var(--ink-3)}
.empty{text-align:center;color:var(--ink-3);padding:48px 0;font-size:13.5px}
.empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.7}

.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
  background:rgba(17,24,39,.94);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.24s;z-index:99;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.modal-mask{
  position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);z-index:60;
  display:grid;place-items:center;padding:20px;animation:fade .18s;
}
.modal{
  background:#fff;border-radius:18px;padding:24px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);
}
.modal h3{margin:0 0 8px;font-size:17px}
.modal p{margin:0 0 18px;color:var(--ink-2);font-size:13.5px;line-height:1.7}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.drawer-btn{display:none}
@media (max-width:900px){
  .paper-grid,.mini-grid{grid-template-columns:1fr}
  .quiz-body{grid-template-columns:minmax(0,1fr)}
  .side{
    position:fixed;right:0;top:0;bottom:0;width:300px;max-width:86vw;border-radius:0;z-index:50;
    transform:translateX(105%);transition:.24s;overflow:auto;padding-top:20px;box-shadow:-10px 0 40px rgba(15,23,42,.18);
  }
  .side.open{transform:none}
  .drawer-btn{display:inline-flex}
  .q-card{padding:18px 16px}
  .q-stem{font-size:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{padding:22px 18px}
  .hero h1{font-size:21px}
  .result-hero{gap:18px}
  .score-ring{width:120px;height:120px}
  .score-ring .val b{font-size:30px}
  .topbar-inner{padding:8px 10px;gap:6px;min-height:52px}
  .brand{gap:8px}
  .brand>div:last-child{font-size:12.5px}
  .brand small{display:none}
  .brand .logo{width:26px;height:26px;border-radius:8px;font-size:12px}
  .top-link{padding:6px 8px;font-size:12px;border-radius:9px}
  .cell{font-size:10.5px}
  /* v2.4.0 手机端：底部操作行换行不溢出 + 触控区加大 */
  .q-foot{flex-wrap:wrap;row-gap:8px}
  .q-foot .spacer{display:none}
  .q-foot .btn{min-height:38px}
}
/* start dialog */
.start-modal{max-width:480px}
.start-sub{margin-bottom:2px}
.opt-row{display:flex;align-items:center;gap:12px;margin:16px 0}
.opt-row>label{width:62px;flex:none;color:var(--ink-2);font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 18px;font-size:13px;color:var(--ink-2);transition:.14s}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.checks{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink)}
.checks label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.start-note{font-size:12.5px;color:var(--ink-3);margin:14px 0 0}
.start-warn{font-size:12.5px;color:#9a5b04;background:var(--warn-soft);border:1px solid #fde3bd;border-radius:10px;padding:8px 10px;margin:12px 0 0}
.order-btn.on{background:var(--brand-soft);border-color:#c7d2fe;color:var(--brand)}

/* paper module picker */
.paper-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 6px}
.paper-title{font-size:20px;font-weight:700;letter-spacing:.3px}
.paper-tip{color:var(--ink-3);font-size:12.5px;margin:0 0 20px;line-height:1.7}
.mod-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mod-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:.18s}
.mod-card:hover{border-color:#c7d2fe;box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.mod-top{display:flex;align-items:baseline;gap:8px}
.mod-name{font-size:16.5px;font-weight:700}
.mod-count{color:var(--ink-3);font-size:12.5px;margin-left:auto}
.mod-bar{height:7px;background:#eef1f7;border-radius:99px;overflow:hidden}
.mod-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#7c3aed);border-radius:99px;transition:width .3s}
.mod-meta{color:var(--ink-2);font-size:12.5px}
.mod-ops{display:flex;gap:8px;margin-top:2px}
.mod-ops .btn{flex:1}
@media (max-width:760px){.mod-grid{grid-template-columns:1fr}}

/* history */
.his-row{gap:14px}
.his-score{width:66px;flex:none;text-align:center;border-right:1px dashed var(--line);padding-right:10px}
.his-score b{display:block;font-size:15px;color:var(--brand)}
.his-score span{font-size:11px;color:var(--ink-3)}
.his-pct{flex:none}
.his-title{font-size:13.5px}

.hidden{display:none!important}
.kbd-hint{opacity:.75}
@media (max-width:900px){.kbd-hint{display:none}}
@media (max-width:560px){
  .opt-row{flex-direction:column;align-items:flex-start;gap:7px;margin:13px 0}
  .opt-row>label{width:auto;font-size:12.5px}
  .checks{gap:14px}
  .quiz-top{gap:6px;row-gap:8px}
  .quiz-top .tag.gray{display:none}
  .quiz-top .title{font-size:14.5px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .quiz-top .timer{font-size:14.5px;padding:5px 9px}
  .qtop-actions{margin-left:auto}
  .order-btn{padding:5px 8px}
}

/* v2.1.0：卷卡片次级入口 + 列表题型筛选 */
.card-links{display:flex;gap:8px;align-items:center;margin-top:-6px;flex-wrap:wrap}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.fbtn{border:1px solid var(--line);background:#fff;color:var(--ink-2);padding:5px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:.15s}
.fbtn.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.fbtn:hover{border-color:#c7d2fe;color:var(--brand)}

/* v2.2.0：答题卡题型分组 */
@media (max-width:900px){
  .card-group{grid-template-columns:repeat(10,1fr)}
}
.his-review{flex:none;white-space:nowrap}
@media (max-width:560px){
  .his-review{font-size:11px;padding:5px 7px}
  .card-group{grid-template-columns:repeat(8,1fr);gap:4px}
}


</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo">AI</div>
      <div>人工智能训练师 · 理论自测
        <small>2026 广东省人工智能与机器人技能大赛</small>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="top-link" data-nav="home">首页</button>
    <button class="top-link" data-nav="wrong">错题本 <span id="navWrong"></span></button>
    <button class="top-link" data-nav="key">答案管理</button>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<!-- ============ 首页 ============ -->
<template id="tpl-home">
  <section class="view-enter">
    <div class="hero">
      <h1>理论题库 · 训练与考试</h1>
      <p>2026年广东省人工智能与机器人技能大赛（人工智能训练师赛项）初赛理论题库</p>
      <div class="hero-chips">
        <span class="chip">官方题库</span>
        <span class="chip">共 1445 题</span>
        <span class="chip">单选 849 · 多选 231 · 判断 365</span>
        <span class="chip">含知识点与解析</span>
      </div>
      <div class="hero-actions">
        <button class="btn btn-primary" data-act="random-exam">全库随机练习（1445 题）</button>
        <button class="btn btn-ghost" data-act="open-wrong">错题重练</button>
      </div>
    </div>
    <div class="notice ok" id="notice">
      <span>✅</span>
      <div><b>官方题库已收录：</b>单选 849 / 多选 231 / 判断 365，共 1445 题，答案提取自题库原文的【答案】标注（2026-10-27），部分题目附知识点与解析。如后续有官方更正，可在「答案管理」中粘贴覆盖。</div>
    </div>
    <div class="section-title"><h2>开始训练</h2><span>整套训练/考试做完全部题，也可按题型专项练</span></div>
    <div class="paper-grid" id="paperGrid"></div>
    <div class="section-title"><h2>专项练习</h2><span>跨卷混合 · 不占正式进度</span></div>
    <div class="mini-grid" id="miniGrid"></div>
    <div class="section-title"><h2>学习概况</h2><span>数据保存在本机浏览器 · <a href="javascript:;" data-act="open-history">查看学习记录 →</a></span></div>
    <div class="kpis" id="homeKpis"></div>
  </section>
</template>

<template id="tpl-paper-card">
  <article class="paper-card">
    <h3><span class="dot"></span><span class="p-title"></span></h3>
    <div class="meta p-meta">1445 题 · 满分 100</div>
    <div class="stat">
      <div><b class="p-score">—</b><span>最高分</span></div>
      <div class="sep"></div>
      <div><b class="p-done">0</b><span>已答</span></div>
    </div>
    <div class="ops">
      <button class="btn btn-primary" data-act="card-exam">开始考试</button>
      <button class="btn" data-act="card-practice">练习模式</button>
    </div>
    <div class="card-links">
      <button class="btn btn-sm btn-ghost p-modules" data-act="card-modules">按题型练习 →</button>
      <button class="btn btn-sm btn-ghost p-resume hidden" data-act="card-resume">继续上次作答</button>
    </div>
  </article>
</template>

<template id="tpl-kpi">
  <div class="kpi"><span></span><b></b></div>
</template>

<!-- ============ 题型模块 ============ -->
<template id="tpl-paper">
  <section class="view-enter">
    <div class="paper-head">
      <button class="btn btn-sm btn-ghost" data-act="paper-back">← 返回</button>
      <div class="paper-title" id="paperTitle"></div>
      <div class="seg" id="paperMode">
        <button type="button" data-mode="exam">考试</button>
        <button type="button" data-mode="practice">练习</button>
      </div>
    </div>
    <p class="paper-tip">先选题型模块。进入答题后，点顶部「顺序 / 随机」就能随时切换——比如进「多选题」模块再点随机，只打乱多选题。</p>
    <div class="mod-grid" id="modList"></div>
  </section>
</template>

<template id="tpl-mod-card">
  <div class="mod-card">
    <div class="mod-top">
      <span class="mod-name"></span>
      <span class="mod-count"></span>
    </div>
    <div class="mod-bar"><i></i></div>
    <div class="mod-meta"></div>
    <div class="mod-ops">
      <button class="btn btn-primary btn-sm" data-act="mod-start">开始</button>
      <button class="btn btn-sm" data-act="mod-redo">重做</button>
    </div>
  </div>
</template>

<!-- ============ 答题 ============ -->
<template id="tpl-quiz">
  <section class="quiz-shell view-enter">
    <div class="quiz-top">
      <button class="btn btn-sm btn-ghost" data-act="exit">← 返回</button>
      <div class="title" id="qTitle"></div>
      <span class="tag gray" id="qModeTag"></span>
      <button class="btn btn-sm order-btn" data-act="order-toggle" id="btnOrder" title="切换出题顺序">顺序</button>
      <span class="qtop-spacer"></span>
      <div class="timer" id="timer"><span>⏱</span><span id="timerText">90:00</span></div>
      <div class="qtop-actions">
        <button class="btn btn-sm drawer-btn" data-act="toggle-card">答题卡</button>
        <button class="btn btn-primary btn-sm" data-act="submit">交卷</button>
      </div>
    </div>
    <div class="quiz-body">
      <div class="q-card">
        <div class="q-head">
          <span class="num" id="qNo"></span>
          <span class="tag" id="qType"></span>
          <span id="qHint"></span>
          <button class="fav" data-act="fav" title="收藏本题">☆</button>
        </div>
        <h2 class="q-stem" id="qStem"></h2>
        <div class="opts" id="qOpts"></div>
        <div class="feedback hidden" id="qFeedback"></div>
        <div class="q-foot">
          <button class="btn btn-sm" data-act="confirm-multi" id="btnConfirmMulti">确认作答</button>
          <button class="btn btn-sm" data-act="mark" id="btnMark">标记</button>
          <button class="btn btn-sm" data-act="clear" id="btnClear">清空本题</button>
          <span class="hint kbd-hint">键盘：1–4 / A–D 选择 · ← → 切题 · 练习答对自动下一题</span>
          <span class="spacer"></span>
          <button class="btn btn-sm" data-act="prev">上一题</button>
          <button class="btn btn-primary btn-sm" data-act="next">下一题</button>
        </div>
      </div>
      <aside class="side" id="sideCard">
        <h4>答题卡 <span id="cardProgress"></span></h4>
        <div class="cards" id="cards"></div>
        <div class="legend">
          <span><i class="l1"></i>已答</span>
          <span><i class="l2"></i>未答</span>
          <span><i class="l3"></i>标记</span>
        </div>
        <div class="mini-info">
          <div><b id="infoDone">0</b>已答</div>
          <div><b id="infoFlag">0</b>标记</div>
          <div><b id="infoLeft">100</b>未答</div>
        </div>
      </aside>
    </div>
  </section>
</template>

<template id="tpl-option">
  <div class="opt" data-letter="">
    <span class="letter"></span>
    <span class="txt"></span>
    <span class="mark"></span>
  </div>
</template>

<template id="tpl-cell">
  <button class="cell" data-idx=""></button>
</template>

<!-- ============ 结果 ============ -->
<template id="tpl-result">
  <section class="view-enter">
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 150 150" width="100%" height="100%">
          <circle cx="75" cy="75" r="64" fill="none" stroke="#eef1f7" stroke-width="12"></circle>
          <circle id="ring" cx="75" cy="75" r="64" fill="none" stroke="#3b5bdb" stroke-width="12"
                  stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="402"></circle>
        </svg>
        <div class="val"><b id="scoreVal">0</b><span id="scoreOf">得分</span></div>
      </div>
      <div class="result-main">
        <h1 id="resTitle">交卷完成</h1>
        <div class="sub" id="resSub"></div>
        <div class="result-actions">
          <button class="btn btn-primary" data-act="retry">重做本卷</button>
          <button class="btn" data-act="to-paper">换个题型</button>
          <button class="btn" data-act="to-wrong">去错题本</button>
          <button class="btn" data-act="home">返回首页</button>
        </div>
      </div>
    </div>
    <div class="kpis" id="resKpis"></div>
    <div class="section-title">
      <h2>逐题回顾</h2>
      <span id="revToggle" style="cursor:pointer;color:var(--brand)">只看错题</span>
    </div>
    <div class="review" id="review"></div>
  </section>
</template>

<template id="tpl-review">
  <div class="rev-item">
    <div class="rh"><span class="no"></span><span class="tag"></span><span class="badge-wrap"></span></div>
    <div class="rs"></div>
    <div class="ro ro-my"><b>你的答案：</b><span></span></div>
    <div class="ro ro-ck"><b>参考答案：</b><span></span></div>
  </div>
</template>

<!-- ============ 列表（错题/收藏） ============ -->
<template id="tpl-list">
  <section class="view-enter">
    <div class="panel">
      <h2 id="listTitle"></h2>
      <p class="desc" id="listDesc"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        <button class="btn btn-primary" data-act="list-practice">开始重练</button>
        <button class="btn" data-act="list-clear">清空列表</button>
      </div>
      <div class="list" id="listBody"></div>
    </div>
  </section>
</template>

<template id="tpl-row">
  <div class="row">
    <span class="tag"></span>
    <div class="grow">
      <div class="qtext"></div>
      <div class="qsub"></div>
    </div>
    <button class="btn btn-sm btn-ghost" data-act="row-go">查看</button>
    <button class="btn btn-sm btn-ghost" data-act="row-del">移除</button>
  </div>
</template>

<!-- ============ 学习记录 ============ -->
<template id="tpl-history">
  <section class="view-enter">
    <div class="panel">
      <h2>学习记录</h2>
      <p class="desc" id="hisDesc"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        <button class="btn btn-sm" data-act="his-export">导出记录（JSON）</button>
        <button class="btn btn-sm" data-act="his-clear" style="color:var(--bad)">清空记录</button>
      </div>
      <div class="list" id="hisList"></div>
    </div>
  </section>
</template>

<template id="tpl-his-row">
  <div class="row his-row">
    <div class="his-score"><b></b><span></span></div>
    <div class="grow">
      <div class="qtext his-title"></div>
      <div class="qsub his-meta"></div>
    </div>
    <span class="ans-badge mid his-pct"></span>
    <button class="btn btn-sm btn-ghost his-review hidden" data-act="his-review">回顾错题</button>
  </div>
</template>

<!-- ============ 答案管理 ============ -->
<template id="tpl-key">
  <section class="view-enter">
    <div class="panel">
      <h2>答案管理</h2>
      <p class="desc">
        这里可以批量修正标准答案（例如按问卷星交卷后显示的官方答案）。格式：每行「题号 答案」，如 <b>1 D</b>、<b>12 AB</b>；
        也支持 <b>1D</b>、<b>1、D</b> 或用逗号、分号分隔。保存后所有成绩、错题会按新答案重算。
      </p>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
        <select id="keyPaper"></select>
        <button class="btn btn-sm" data-act="key-load">载入当前答案</button>
        <button class="btn btn-sm" data-act="key-reset">恢复默认答案</button>
        <span class="hint" id="keyStat"></span>
      </div>
      <textarea id="keyText" spellcheck="false" placeholder="1 D&#10;2 B&#10;3 A"></textarea>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
        <button class="btn btn-primary" data-act="key-apply">保存并重新计分</button>
        <button class="btn" data-act="key-export">导出全部答案（JSON）</button>
        <button class="btn" data-act="key-import">导入答案（JSON）</button>
        <button class="btn" data-act="key-reset-all" style="margin-left:auto;color:var(--bad)">重置全部进度</button>
      </div>
      <p class="desc" style="margin-top:16px;margin-bottom:0">
        <b>提示：</b>「恢复默认答案」只会清除你手动修改过的题目，回到页面自带答案。
      </p>
    </div>
  </section>
</template>

<template id="tpl-modal">
  <div class="modal-mask">
    <div class="modal">
      <h3></h3>
      <p></p>
      <div class="acts">
        <button class="btn" data-act="modal-cancel">取消</button>
        <button class="btn btn-primary" data-act="modal-ok">确定</button>
      </div>
    </div>
  </div>
</template>

1118,"t":"judge","q":"某产品团队只在全部页面开发完成后进行一次规范检查，认为设计早期和开发过程中无需检查。","o":["正确","错误"],"kp":"交互规范检查的全过程实施","an":"规范检查应贯穿设计、开发和验收过程，早期检查能够降低后期返工成本，开发中检查能够及时发现实现偏差。只在全部页面完成后检查不符合持续质量控制原则，因此题干说法错误。"},{"n":1119,"t":"judge","q":"K 折交叉验证是将数据集随机分成K 个子集，然后每次使用其中一个子集作为测试集，剩余的K-1 个子集作为训练集。","o":["正确","错误"],"kp":"","an":""},{"n":1120,"t":"judge","q":"某企业通过应急演练检查预案流程是否可执行、人员是否清楚职责，并提升突发事件响应能力。","o":["正确","错误"],"kp":"应急演练的主要作用","an":"应急演练用于检验预案是否可执行、人员职责是否清晰、资源是否可用，并提升组织的突发事件响应能力。题干表述正确，因此A 正确。"},{"n":1121,"t":"judge","q":"P-R 曲线的纵坐标表示召回率，横坐标表示精确率。","o":["正确","错误"],"kp":"","an":""},{"n":1122,"t":"judge","q":"RGB 颜色空间中，（0，255，0）是黄色。","o":["正确","错误"],"kp":"","an":""},{"n":1123,"t":"judge","q":"强化学习的环境是客观存在的。","o":["正确","错误"],"kp":"","an":""},{"n":1124,"t":"judge","q":"模型蒸馏是模型优化中的重要技术，过程是使用小模型取代大模型。","o":["正确","错误"],"kp":"","an":""},{"n":1125,"t":"judge","q":"某故障由误操作、审批缺失和系统保护不足共同造成。团队认为根因分析只需检查技术问题，无需分析人员和流程因素。","o":["正确","错误"],"kp":"故障根因分析与定位的方法","an":"故障可能由人员操作、流程控制和技术保护共同作用形成，根因分析应覆盖人、流程和技术等因素，因此只检查技术问题的说法错误，B 正确。"},{"n":1126,"t":"judge","q":"在高并发压力测试中，如果请求数增加导致响应时间显著上升并出现超时，说明系统存在性能瓶颈，需要进行优化。","o":["正确","错误"],"kp":"","an":""},{"n":1127,"t":"judge","q":"大数据技术可以实时处理数据流","o":["正确","错误"],"kp":"","an":""},{"n":1128,"t":"judge","q":"数据录入过程、数据整合过程都可能会产生重复数据，直接删除是重复数据处理的主要方法。","o":["正确","错误"],"kp":"","an":""},{"n":1129,"t":"judge","q":"数据清洗是数据分析过程中的一个可选步骤，可以忽略不计。","o":["正确","错误"],"kp":"","an":""},{"n":1130,"t":"judge","q":"自动化管理是特征构造方法常见的应用场景。","o":["正确","错误"],"kp":"","an":""},{"n":1131,"t":"judge","q":"某团队认为变更流程刚启动时就必须先取得发布审核批准，否则不能进行方案评估和风险分析。","o":["正确","错误"],"kp":"变更评估与发布审核的顺序","an":"变更流程启动后通常应先完成方案评估、影响分析、风险评估和测试准备，再提交发布审核。要求在任何评估前先取得发布批准，流程顺序不合理，因此B 正确。"},{"n":1132,"t":"judge","q":"有效语音的判定不需要考虑语音的背景噪声水平。","o":["正确","错误"],"kp":"","an":""},{"n":1133,"t":"judge","q":"在混合模式标注项目中，引入自动化工具总是可以提高标注效率。","o":["正确","错误"],"kp":"","an":""},{"n":1134,"t":"judge","q":"当数据受到噪声影响时，最小的特征值所对应的特征向量往往与噪声有关，舍弃能在一定程度上起到降噪的效果，这是PCA 算法的优点。","o":["正确","错误"],"kp":"","an":""},{"n":1135,"t":"judge","q":"在模型调优时，选 udge","q":"人工智能产品采用B/S 架构，用户需要安装专用的用户端软件才能使用。","o":["正确","错误"],"kp":"","an":""},{"n":1154,"t":"judge","q":"模型量化后，模型推理速度会提高。","o":["正确","错误"],"kp":"","an":""},{"n":1155,"t":"judge","q":"模型训练完成后，在部署前，常用的优化手段是量化，剪枝，蒸馏。","o":["正确","错误"],"kp":"","an":""},{"n":1156,"t":"judge","q":"某支付故障复盘报告记录了故障时间线、直接原因、根本原因和后续改进措施。这符合故障复盘要求。","o":["正确","错误"],"kp":"故障根因分析与定位的方法","an":"规范复盘应记录故障时间线、直接原因、根本原因和改进措施，以还原经过、解释成因并推动预防复发，因此A 正确。"},{"n":1157,"t":"judge","q":"人工智能项目开发过程中的输入输出分析决定了模型的功能。","o":["正确","错误"],"kp":"","an":""},{"n":1158,"t":"judge","q":"深度学习中的自编码器Autoencoder 是一种无监督学习算法，用于学习数据的压缩表示。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1159,"t":"judge","q":"机器学习是人工智能的一个分支，它使计算机能够在不进行明确编程的情况下从数据中学习。","o":["正确","错误"],"kp":"","an":""},{"n":1160,"t":"judge","q":"在监督学习中，模型在训练阶段需要输入数据及其对应的标签。","o":["正确","错误"],"kp":"","an":""},{"n":1161,"t":"judge","q":"人工智能的发展完全依赖于算法的进步，与数据的质量和数量无关。","o":["正确","错误"],"kp":"","an":""},{"n":1162,"t":"judge","q":"深度学习算法可以自动提取输入数据的特征表示。","o":["正确","错误"],"kp":"","an":""},{"n":1163,"t":"judge","q":"某应急演练完成后，团队立即解散，不记录问题、不复盘过程，也不更新预案。","o":["正确","错误"],"kp":"演练复盘与预案更新","an":"应急演练结束后需要记录过程、复盘问题、制定整改措施并根据结果更新预案。立即解散且不留记录，无法形成改进闭环，因此B 正确。"},{"n":1164,"t":"judge","q":"数据增强（dataaugmentation）在目标检测中主要用于扩充训练数据集的规模。","o":["正确","错误"],"kp":"","an":""},{"n":1165,"t":"judge","q":"某业务链路的服务器指标正常，但订单成功率和用户投诉明显恶化。团队认为健康度评估只需技术指标，无需业务指标。","o":["正确","错误"],"kp":"技术指标与业务指标结合","an":"服务器指标正常并不代表业务链路健康。订单成功率下降和投诉增加说明业务结果异常，健康度评估必须同时关注技术指标和业务指标，因此B 正确。"},{"n":1166,"t":"judge","q":"AI 数据采集是指从相同来源收集数据以供AI 模型训练使用的过程。","o":["正确","错误"],"kp":"","an":""},{"n":1167,"t":"judge","q":"AI 数据标注是指对收集到的数据进行标记或注释，以便AI 模型能够更好地理解和处理这些数据。","o":["正确","错误"],"kp":"","an":""},{"n":1168,"t":"judge","q":"AI 算法测试是为了评估AI 模型的性能和准确性，通常包括在不同的数据集上进行测试。","o":["正确","错误"],"kp":"","an":""},{"n":1169,"t":"judge","q":"机器学习的学习方式是通过获得经验或历史数据不断改进提高做某项任务的表现。","o":["正确","错误"],"kp":"","an":""},{"n":1170,"t":"judge","q":"声音转文字如果没有达到100%，说明这个模型不行","o":["正确","错误"],"kp":"","an":""},{"n":1171,"t":"judge","q":"文本语言生成在神经网络模型上存在一字随机性，但风险是可控的","o":["正确","错误"],"kp":"","an":""},{"n":1172,"t":"judge","q":"ASR 的模型识别的是所有说普通话的语音，他不对人做区别，而TTS 是千人千面的，每一个人的声音都不一样","o":["正确","错误"],"kp":"","an":""},{"n":1173,"t":"judge","q":"Hough 变换法的主要问题是受噪声影响，难以拟合得到准确模型。","o":["正确","错误"],"kp":"","an":""},{"n":1174,"t":"judge","q":"RGB 颜色模型通常用于彩色阴极摄像管等彩色光栅图形显示设备中。","o":["正确","错误"],"kp":"","an":""},{"n":1175,"t":"judge","q":"语音识别的模型训练是指按照一定准则，从大量已知模式中获取表征该模式本质特征的模型参数的过程。","o":["正确","错误"],"kp":"","an":""},{"n":1176,"t":"judge","q":"某内部管理系统进行交互评审时，没有邀请真实用户代表参加。团队据此认为该次评审一定无效。","o":["正确","错误"],"kp":"交互评审的参与角色","an":"真实用户代表能够提供重要视角，但交互评审还可以由设计、产品、开发、测试和业务人员依据规范、任务和约束开展。未邀请真实用户不代表评审一定无效，因此题干说法错误。"},{"n":1177,"t":"judge","q":"语音识别的模式匹配是根据一定准则，使未知模式与模型库中的某一个模型获得最佳匹配的过程。","o":["正确","错误"],"kp":"","an":""},{"n":1178,"t":"judge","q":"损失函数与模型函数是一回事","o":["正确","错误"],"kp":"","an":""},{"n":1179,"t":"judge","q":"某系统日志除记录报错外，还记录用户登录、订单创建和任务完成等正常业务事件。团队认为日志只能记录错误信息。","o":["正确","错误"],"kp":"日志记录的内容范围","an":"日志不仅用于记录错误，还可以记录登录、订单创建、任务完成等正常业务事件，为审计、分析和问题定位提供依据。因此“只能记录错误信息”错误，B 正确。"},{"n":1180,"t":"judge","q":"FasterR-CNN 模型可以用于变压器部件图像的目标检测任务","o":["正确","错误"],"kp":"","an":""},{"n":1181,"t":"judge","q":"应用于电力行业的图像识别技术包括图像增强与分割、特征提取、识别模型构建等关键技术","o":["正确","错误"],"kp":"","an":""},{"n":1182,"t":"judge","q":"传统技术方法已无法满足电网业务的快速发展需求和解决相关业务痛点，需借助人工智能技术，从模型、样本、平台、通用组件、各专业智能化应用、运营机制、开放生态等多个方面统筹开展人工智能体系设计，加快人工智能的应用落地","o":["正确","错误"],"kp":"","an":""},{"n":1183,"t":"judge","q":"某指标体系的权重由负责人凭个人经验直接确定，不参考数据、专家意见或业务影响。","o":["正确","错误"],"kp":"监控指标体系设计的方法","an":"指标权重应结合业务影响、数据分析、专家意见或层次分析等方法确定，仅凭个人经验容易产生偏差，因此题干做法不合理，B 正确。"},{"n":1184,"t":"judge","q":"算法的准确性可以通过单一的测试案例来全面评估。","o":["正确","错误"],"kp":"","an":""},{"n":1185,"t":"judge","q":"对于所有算法，最好情况复杂度都比最坏情况复杂度更有用。","o":["正确","错误"],"kp":"","an":""},{"n":1186,"t":"judge","q":"工匠精神强调的是对工作成果的完美追求，不包括创新和改进。","o":["正确","错误"],"kp":"","an":""},{"n":1187,"t":"judge","q":"回归分析中，只包括一个自变量和一个因变量，且二者的关系可用一条直线近似表示，这种回归分析称为一元线性回归分析。","o":["正确","错误"],"kp":"","an":""},{"n":1188,"t":"judge","q":"某监控报表需要提供给外部合作方，团队对账号、手机号和设备标识进行脱敏处理。数据脱敏属于常用的数据治理与权限管理方法。","o":["正确","错误"],"kp":"监控数据治理与权限管理的方法","an":"对账号、手机号和设备标识进行脱敏，可以降低数据共享过程中直接识别个人或设备的风险，是常用的数据治理和隐私保护措施，因此A 正确。"},{"n":1189,"t":"judge","q":"某移动应用调整导航层级时，团队认为应优先方便开发实现，即使用户难以查找内容，也无需考虑用户需求。","o":["正确","错误"],"kp":"信息架构的用户中心原则","an":"导航层级设计的首要目标是帮助用户理解内容结构并快速找到目标信息。只为方便开发而忽视用户需求，会降低可发现性和操作效率，因此B 正确。"},{"n":1190,"t":"judge","q":"处理噪声数据可以采用分箱的方法。","o":["正确","错误"],"kp":"","an":""},{"n":1191,"t":"judge","q":"某支付平台设定99.95%的可用性目标前，分析了历史故障数据、业务峰值和客户需求。这符合SLO 设定方法。","o":["正确","错误"],"kp":"服务等级指标与SLA 管理的方法","an":"SLO 是服务团队设定的目标水平，应结合历史表现、业务峰值、用户需求和可实现性确定，题干的设定过程符合这一方法，因此A 正确。"},{"n":1192,"t":"judge","q":"召回率不是分类算法常用的评价指标。","o":["正确","错误"],"kp":"","an":""},{"n":1193,"t":"judge","q":"某电商平台分析用户反馈时只保留投诉和差评，认为好评及正面建议对后续迭代没有参考价值。","o":["正确","错误"],"kp":"用户反馈信息的全面收集","an":"好评和正面建议可以帮助团队识别产品优势、用户认可点和可持续强化的功能，与投诉和差评同样具有迭代价值。因此只保留负面反馈会造成分析偏差，题干说法错误。"},{"n":1194,"t":"judge","q":"某监控平台只关注数据采集和使用权限，不规定监控数据何时归档、保留或销毁。团队认为权限治理无需考虑数据生命周期。","o":["正确","错误"],"kp":"监控数据治理与权限管理的方法","an":"监控数据治理应覆盖采集、存储、使用、归档、保留和销毁等全生命周期，权限治理也应随数据生命周期变化进行调整，因此题干说法错误，B 正确。"},{"n":1195,"t":"judge","q":"数据分析的主要目的是通过挖掘数据中的模式和关联，来预测未来的趋势","o":["正确","错误"],"kp":"","an":""},{"n":1196,"t":"judge","q":"数据清洗的目的是提高数据的准确性和可用性。","o":["正确","错误"],"kp":"","an":""},{"n":1197,"t":"judge","q":"企业在追求利润的同时，可以忽视职业道德的建设。","o":["正确","错误"],"kp":"","an":""},{"n":1198,"t":"judge","q":"某商品详情页层级较深，用户容易忘记当前位置。设计人员认为，为减少页面元素，应完全避免使用面包屑导航。","o":["正确","错误"],"kp":"面包屑导航的适用场景","an":"在层级较深的网站中，面包屑导航能够显示当前位置和上级路径，帮助用户理解层级并快速返回，因此不应完全避免使用，B 正确。"},{"n":1199,"t":"judge","q":"金具作为输电线路的重要组成部分，利用深度学习模型可对金具缺陷进行目标检测","o":["正确","错误"],"kp":"","an":""},{"n":1200,"t":"judge","q":"某交易系统对所有高频读写数据都增加缓存，却不设计更新、失效和一致性策略。团队认为缓存适用于所有场景且无需考虑一致性。","o":["正确","错误"],"kp":"系统性能瓶颈分析与调优的方法","an":"缓存需要结合数据读写模式设计更新、失效和一致性策略，并非所有场景都适用，因此题干说法错误，B 正确。"},{"n":1201,"t":"judge","q":"在深度学习模型训练中，学习率越大，训练速度越快，最优解越精确","o":["正确","错误"],"kp":"","an":""},{"n":1202,"t":"judge","q":"某多端产品的同一按钮在移动端需要大触控区域，在桌面端需要悬停状态。团队通过组件变体机制管理这些差异化需求。","o":["正确","错误"],"kp":"组件变体机制","an":"移动端和桌面端在触控面积、悬停状态等方面存在平台差异。通过组件变体管理同一组件在不同端的状态和属性，可以保持核心一致并满足端侧需求，因此题干说法正确。"},{"n":1203,"t":"judge","q":"省级人工智能服务门户提供运行环境、模型库、样本库、应用管理等统一入口；提供通用模型、专用模型、应用案例等开放能力服务","o":["正确","错误"],"kp":"","an":""},{"n":1204,"t":"judge","q":"训练故障诊断模型时，如果故障种类增加，可直接增加模型输出的分类数，不需要更改模型结构或增加模型的复杂度","o":["正确","错误"],"kp":"","an":""},{"n":1205,"t":"judge","q":"某旅游平台输出用户从行程搜索到完成预订的旅程成果。团队认为最终产出必须以时间轴、触点图或情绪曲线等可视化形式呈现。","o":["正确","错误"],"kp":"用户旅程成果的呈现形式","an":"时间轴、触点图和情绪曲线是常见呈现方式，但用户旅程成果也可以通过报告、表格、故事板等形式表达，不是必须采用特定可视化形式，因此B 正确。"},{"n":1206,"t":"judge","q":"电力监测可基于线性回归等算法进行设备状态识别。线性回归就是试图学习一个以连续值为输出的线性模型，解法为最小二乘法，不可以使用一般的梯度下降法求解","o":["正确","错误"],"kp":"","an":""},{"n":1207,"t":"judge","q":"在人工智能能力构建过程中，电力定制化场景的样本归集、模型训练与发布能力由人工智能两库一平台提供，组件仅面向业务中台提供接口服务","o":["正确","错误"],"kp":"","an":""},{"n":1208,"t":"judge","q":"某系统全年使用同一告警阈值，即使业务高峰、低峰和基线发生变化，也不允许动态调整。","o":["正确","错误"],"kp":"动态告警阈值","an":"业务高峰、低峰和系统基线会变化，告警阈值应结合历史基线、业务周期和实时状态动态调整。全年固定同一阈值容易造成误报或漏报，因此B 正确。"},{"n":1209,"t":"judge","q":"情感分析任务其实是个分类任务，给模型输入一句话，让它判断这句话的情感是积极的、消极的，还是中性的","o":["正确","错误"],"kp":"","an":""},{"n":1210,"t":"judge","q":"在构建配电网可靠性分类模型的过程中，元件是否正常运行可作为模型的特征，元件故障率的影响因素可作为模型的标签","o":["正确","错误"],"kp":"","an":""},{"n":1211,"t":"judge","q":"在人工智能领域，卷积神经网络是一种常用于图像识别和语音识别的深度学习模型","o":["正确","错误"],"kp":"","an":""},{"n":1212,"t":"judge","q":"关系模型的外码既是本关系的主码，也是另一类关系的主码。","o":["正确","错误"],"kp":"","an":""},{"n":1213,"t":"judge","q":"某产品团队完成一次功能迭代后，认为只要将结果同步给所有相关团队，运营反馈闭环就已经结束。","o":["正确","错误"],"kp":"运营反馈闭环的结束条件","an":"将迭代结果同步给相关团队只是信息传递环节，闭环还应包括效果验证、指标评估、用户反馈跟踪和经验复盘。因此仅完成同步不能视为闭环结束，题干说法错误。"},{"n":1214,"t":"judge","q":"设X-Y 是关系模型R 的一个函数依赖，如果存在X 的真子集X’使得X’→Y 成立，则称Y 部分依赖于X。","o":["正确","错误"],"kp":"","an":""},{"n":1215,"t":"judge","q":"Transformer 模型是基于循环网络（RNN）架构的。","o":["正确","错误"],"kp":"","an":""},{"n":1216,"t":"judge","q":"Adam 优化器仅适用于小规模的模型训练。","o":["正确","错误"],"kp":"","an":""},{"n":1217,"t":"judge","q":"某老年健康应用设计测试方案时，不区分年轻用户与老年用户的视觉、认知和操作差异，认为参与者背景不必考虑。","o":["正确","错误"],"kp":"可用性测试参与者特征","an":"年轻用户与老年用户在视觉、认知、记忆和操作能力上可能存在差异。测试方案应根据目标用户特征选择样本和设计任务，因此认为参与者背景不必考虑是错误的。"},{"n":1218,"t":"judge","q":"模型微调时，通常需要调整模型的全部参数。","o":["正确","错误"],"kp":"","an":""},{"n":1219,"t":"judge","q":"Transformer 模型的自注意力机制可以加速模型的训练过程。","o":["正确","错误"],"kp":"","an":""},{"n":1220,"t":"judge","q":"BERT 模型通过预训练和微调的方式，可以适应多种不同的自然语言处理任务。","o":["正确","错误"],"kp":"","an":""},{"n":1221,"t":"judge","q":"分布式训练中的流水线并行可以增加模型的深度。","o":["正确","错误"],"kp":"","an":""},{"n":1222,"t":"judge","q":"GPT 模型仅支持英语语言的处理。","o":["正确","错误"],"kp":"","an":""},{"n":1223,"t":"judge","q":"强化学习中的奖励模型微调技术用于提高策略性能。","o":["正确","错误"],"kp":"","an":""},{"n":1224,"t":"judge","q":"引入预训练模型能够提升机器翻译的质量。","o":["正确","错误"],"kp":"","an":""},{"n":1225,"t":"judge","q":"机器学习模型在作为标注者时，不需要任何形式的监督或验证。","o":["正确","错误"],"kp":"","an":""},{"n":1226,"t":"judge","q":"某业务目标和系统架构已发生变化，但团队认为监控指标体系一经确定就不能调整。","o":["正确","错误"],"kp":"监控指标体系设计的方法","an":"业务目标、系统架构和风险会变化，监控指标体系应随之评审和调整，因此“一经确定就不能调整”的说法错误，B 正确。"},{"n":1227,"t":"judge","q":"可视化可用于支持可视化计算。","o":["正确","错误"],"kp":"","an":""},{"n":1228,"t":"judge","q":"数据去重后，数据集中的记录数量一定会减少。","o":["正确","错误"],"kp":"","an":""},{"n":1229,"t":"judge","q":"LDA 是有监督的降维方法，而PCA 是无监督的降维方法。","o":["正确","错误"],"kp":"","an":""},{"n":1230,"t":"judge","q":"职工道德修养与企业发展没有直接关系。","o":["正确","错误"],"kp":"","an":""},{"n":1231,"t":"judge","q":"在数据采集系统中，设置异常报警时，通常不需要考虑历史数据的统计分析来确定阈值","o":["正确","错误"],"kp":"","an":""},{"n":1232,"t":"judge","q":"动态规划算法总是比贪心算法得到的结果更优。","o":["正确","错误"],"kp":"","an":""},{"n":1233,"t":"judge","q":"人机交互系统的成功设计只需注重视觉设计，不需考虑用户的操作习惯","o":["正确","错误"],"kp":"","an":""},{"n":1234,"t":"judge","q":"某公共服务平台只考虑持证残障人士，不考虑老年人、临时受伤者和特殊环境下的使用困难，并称已完成无障碍设计。","o":["正确","错误"],"kp":"无障碍设计的受益人群","an":"无障碍设计不仅服务持证残障人士，也应考虑老年人、临时受伤者、认知或感官能力变化者以及在特殊环境下使用受限的人群。因此只考虑单一群体不能称为完成无障碍设计，题干说法错误。"},{"n":1235,"t":"judge","q":"常见的数据可视化图表类型有柱形图、条形图、饼图和折线图。","o":["正确","错误"],"kp":"","an":""},{"n":1236,"t":"judge","q":"批量归一化有助于加速深度学习模型的训练过程。","o":["正确","错误"],"kp":"","an":""},{"n":1237,"t":"judge","q":"某企业综合监控成功率、延迟和资源指标，同时分析日志和用户反馈，以判断关键业务链路健康度。","o":["正确","错误"],"kp":"关键链路健康度的综合评估","an":"综合监控成功率、延迟和资源指标，并结合日志与用户反馈，可以从业务结果、技术状态和用户影响多个维度判断链路健康度，因此A 正确。"},{"n":1238,"t":"judge","q":"序列到序列模型无法应用于自动文本摘要生成任务。","o":["正确","错误"],"kp":"","an":""},{"n":1239,"t":"judge","q":"某传统数据中心与外包运维服务签订服务可用性和响应时间协议。团队认为SLA 只适用于云计算服务。","o":["正确","错误"],"kp":"服务等级指标与SLA 管理的方法","an":"SLA 适用于任何需要明确服务质量承诺的服务关系，包括传统数据中心、外包运维、网络服务和云服务，并非云计算专属，因此题干说法错误，B 正确。"},{"n":1240,"t":"judge","q":"注意力机制能够提高模型对长距离依赖的捕捉能力。","o":["正确","错误"],"kp":"","an":""},{"n":1241,"t":"judge","q":"使用Dropout 技术可以有效防止深度学习模型的过拟合问题。","o":["正确","错误"],"kp":"","an":""},{"n":1242,"t":"judge","q":"某团队认为只要参与者数量足够多，可用性测试结果就一定更准确，因此样本越多越好。","o":["正确","错误"],"kp":"可用性测试样本规模","an":"测试准确性不仅取决于样本数量，还取决于样本代表性、任务设计、测试方法和数据质量。样本越多不一定越有效，过多样本还可能增加成本而不产生新的问题发现，因此题干说法错误。"},{"n":1243,"t":"judge","q":"某团队设计了大量理想指标，却没有确认数据能否稳定采集和持续维护，并认为可获得性无需考虑。","o":["正确","错误"],"kp":"监控指标体系设计的方法","an":"指标必须具有稳定的数据来源和可持续维护条件，否则即使理论上理想也无法长期监控，因此认为可获得性无需考虑是错误的，B 正确。"},{"n":1244,"t":"judge","q":"某产品负责人要求不同平台的组件外观、尺寸和交互方式完全一致，不允许保留任何平台原生特性。","o":["正确","错误"],"kp":"多端设计中的平台原生特性","an":"多端产品需要保持核心品牌和功能一致，但不同平台在尺寸、输入方式和交互习惯上存在差异，应合理保留平台原生特性。要求所有细节完全一致会降低适配性和用户体验，因此题干说法错误。"},{"n":1245,"t":"judge","q":"引入预训练模型不会影响模型的训练时间。","o":["正确","错误"],"kp":"","an":""},{"n":1246,"t":"judge","q":"某智能硬件上线改进方案后，关键指标仍未达到预期。团队决定返回反馈分析环节，重新检查问题判断和方案假设。","o":["正确","错误"],"kp":"反馈闭环中的回溯与再分析","an":"改进方案上线后若关键指标未达到预期，说明原问题判断、方案假设或实施过程可能存在偏差。返回反馈分析环节重新检查并调整方案，符合闭环迭代原则，因此题干说法正确。"},{"n":1247,"t":"judge","q":"序列标注任务不能通过深度学习模型来解决。","o":["正确","错误"],"kp":"","an":""},{"n":1248,"t":"judge","q":"使用Dropout 技术可以在一定程度上提高模型的泛化能力。","o":["正确","错误"],"kp":"","an":""},{"n":1249,"t":"judge","q":"量子计算是一种能够解决所有经典计算问题的方法。","o":["正确","错误"],"kp":"","an":""},{"n":1250,"t":"judge","q":"某系统遇到任何错误都立即中断任务并返回首页，不保留用户输入，也不提供恢复入口。团队认为所有异常都应这样处理。","o":["正确","错误"],"kp":"异常路径的恢复设计","an":"遇到错误时直接中断、清空输入并返回首页，会增加用户损失和重复操作。异常处理应根据问题类型保留必要数据，并提供解释、重试、修改或人工支持等恢复入口，因此题干说法错误。"},{"n":1251,"t":"judge","q":"模式识别不只适用于图像和声音等传感器数据的处理。","o":["正确","错误"],"kp":"","an":""},{"n":1252,"t":"judge","q":"生物特征识别是一种身份验证技术，因此可以不经许可获取用户生物特征。","o":["正确","错误"],"kp":"","an":""},{"n":1253,"t":"judge","q":"某评审会议只收集设计师之间的修改建议，却没有验证用户任务、业务目标和技术约束。团队仍认为这就是评审会议的主要目的。","o":["正确","错误"],"kp":"交互设计评审的目的","an":"交互设计评审应综合验证用户任务是否顺畅、业务目标是否满足、设计规范是否一致以及技术约束是否可行。只收集设计师之间的修改建议不能覆盖评审目的，因此题干说法错误。"},{"n":1254,"t":"judge","q":"基于ETL 的数据清洗是挖掘有价值数据的一种方案。","o":["正确","错误"],"kp":"","an":""},{"n":1255,"t":"judge","q":"忽略该记录是缺失值处理方法。","o":["正确","错误"],"kp":"","an":""},{"n":1256,"t":"judge","q":"数据清洗时，对于缺失值的处理，简单的删除含有缺失值的记录通常不是最佳做法。","o":["正确","错误"],"kp":"","an":""},{"n":1257,"t":"judge","q":"在所有情况下，数据标准化都是必要的。","o":["正确","错误"],"kp":"","an":""},{"n":1258,"t":"judge","q":"大数据采集过程中，数据的一致性不是需要关注的问题","o":["正确","错误"],"kp":"","an":""},{"n":1259,"t":"judge","q":"数据采集的方法有数据库采集、调查问卷采集、报表采集和网页数据采集。","o":["正确","错误"],"kp":"","an":""},{"n":1260,"t":"judge","q":"大数据处理中的数据清洗是可选的，对数据分析结果没有影响。","o":["正确","错误"],"kp":"","an":""},{"n":1261,"t":"judge","q":"在算法设计中，总是应该优先考虑时间复杂度而非空间复杂度。","o":["正确","错误"],"kp":"","an":""},{"n":1262,"t":"judge","q":"某项目允许发布审核脱离变更单独执行，审核人员不查看变更范围、风险和回滚方案。","o":["正确","错误"],"kp":"发布审核与变更信息的关联","an":"发布审核必须依据变更范围、风险评估、测试结果和回滚方案进行判断，不能脱离变更单独执行。题干中的做法会导致审核失去依据，因此B 正确。"},{"n":1263,"t":"judge","q":"特征选择的主要目的是减少模型的复杂性，提高模型的性能和可解释性。","o":["正确","错误"],"kp":"","an":""},{"n":1264,"t":"judge","q":"人机交互是指用户向计算机单向传递信息。","o":["正确","错误"],"kp":"","an":""},{"n":1265,"t":"judge","q":"在 scikit-learn 中，LabelEncoder 用于处理连续数值特征。","o":["正确","错误"],"kp":"","an":""},{"n":1266,"t":"judge","q":"scikit-learn 中的特征选择模块是基于统计方法的，不包括基于模型的特征选择技术。","o":["正确","错误"],"kp":"","an":""},{"n":1267,"t":"judge","q":"scikit-learn 中的 KMeans 构建模块是用来构建回归算法的。","o":["正确","错误"],"kp":"","an":""},{"n":1268,"t":"judge","q":"某小型系统仅使用指标即可满足当前监控需求。团队认为日志、指标和链路追踪必须同时建设，否则任何一种都无法生效。","o":["正确","错误"],"kp":"可观测性手段的按需建设","an":"日志、指标和链路追踪各有适用场景，小型系统可根据复杂度和问题需求分阶段建设。认为三者必须同时具备，否则任何一种都无法生效，表述过于绝对，因此B 正确。"},{"n":1269,"t":"judge","q":"scikit-learn 中的 LinearDiscriminantAnalysis（LDA）方法是一种基于分类方法的降维方法。","o":["正确","错误"],"kp":"","an":""},{"n":1270,"t":"judge","q":"在数据标注用于监督学习时，标注数据的质量是对模型训练结果有影响的。","o":["正确","错误"],"kp":"","an":""},{"n":1271,"t":"judge","q":"数据挖掘是逻辑回归的应用领域之一。","o":["正确","错误"],"kp":"","an":""},{"n":1272,"t":"judge","q":"数据增强技术在视觉类业务数据处理中有助于提高模型的泛化能力。","o":["正确","错误"],"kp":"","an":""},{"n":1273,"t":"judge","q":"某业务存在明显高峰、低峰和季节变化，但团队要求告警阈值始终固定不变。","o":["正确","错误"],"kp":"异常检测与告警阈值设置的策略","an":"业务存在明显高峰、低峰和季节变化时，固定阈值容易在高峰误报、低峰漏报，应采用分时、动态或季节性阈值，因此题干要求错误，B 正确。"},{"n":1274,"t":"judge","q":"p 值越小，说明数据与原假设越不相容，越有理由拒绝原假设。","o":["正确","错误"],"kp":"","an":""},{"n":1275,"t":"judge","q":"数据可视化的目的仅仅是为了使数据看起来更加美观。","o":["正确","错误"],"kp":"","an":""},{"n":1276,"t":"judge","q":"聚类不是常见的噪声数据的处理方法。","o":["正确","错误"],"kp":"","an":""},{"n":1277,"t":"judge","q":"神经网络通常由输入层、隐藏层、输出层和损失层四部分组成。","o":["正确","错误"],"kp":"","an":""},{"n":1278,"t":"judge","q":"算法的最好情况时间复杂度总是比最坏情况时间复杂度更有指导意义。","o":["正确","错误"],"kp":"","an":""},{"n":1279,"t":"judge","q":"特征选择只适用于监督学习。","o":["正确","错误"],"kp":"","an":""},{"n":1280,"t":"judge","q":"深度学习平台包含深度学习开发框架，不包含模型部署和监控等功能。","o":["正确","错误"],"kp":"","an":""},{"n":1281,"t":"judge","q":"TensorFlow 和 PyTorch 都是静态图（StaticGraph）的深度学习框架。","o":["正确","错误"],"kp":"","an":""},{"n":1282,"t":"judge","q":"手势识别需要用到的技术有图像侦测、图像生成。","o":["正确","错误"],"kp":"","an":""},{"n":1283,"t":"judge","q":"人工智能中数据采集尽量满足独立同分布（I.I.D）。","o":["正确","错误"],"kp":"","an":""},{"n":1284,"t":"judge","q":"某银行线下网点准备优化取号、等候、办理和离店体验。团队认为用户旅程设计只能用于网站和应用，不能用于线下服务。","o":["正确","错误"],"kp":"用户旅程的线上线下适用范围","an":"用户旅程可以用于网站、应用、门店、医院、银行等线上和线下服务场景，只要存在连续阶段和触点即可分析，因此B 正确。"},{"n":1285,"t":"judge","q":"某团队把WCAG2.1 的AA 级描述为所有场景下国际通用的最低无障碍合规等级。","o":["正确","错误"],"kp":"WCAG 等级与合规适用性","an":"WCAG2.1 的AA 级是许多项目常采用的目标等级，但具体最低合规要求取决于国家地区、行业、合同和场景，不能描述为所有场景下国际通用的最低等级，因此题干说法错误。"},{"n":1286,"t":"judge","q":"人脸识别广泛应用于身份识别等安防领域。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1287,"t":"judge","q":"某支付系统需要描述“待支付、处理中、支付成功、支付失败”等状态及转换条件。设计人员认为，只有状态机模型才能有效描述交互状态流转，其他图示或模型均不可使用。","o":["正确","错误"],"kp":"交互状态流转的建模方法","an":"交互状态流转可以使用状态机、状态流转图、流程图等多种模型描述，具体方法应根据系统复杂度和表达目的选择。“只有状态机模型才能有效描述”属于绝对化表述，因此B 正确。"},{"n":1288,"t":"judge","q":"人脸检测在实际中主要用于人脸识别的预处理，即在图像中准确标定出人脸的位置和大小。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1289,"t":"judge","q":"人脸识别系统成功的关键在于是否拥有尖端的核心算法。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1290,"t":"judge","q":"某测试数据包含用户身份和业务敏感信息，但团队认为数据集管理无需考虑隐私和合规。","o":["正确","错误"],"kp":"测试数据集构建、管理与更新的方法","an":"测试数据包含身份和业务敏感信息时，必须实施脱敏、授权、审计和合规管理，因此认为无需考虑隐私合规是错误的，B 正确。"},{"n":1291,"t":"judge","q":"某知识平台只使用卡片分类法评估栏目结构，并认为该方法能够唯一衡量所有用户的满意度。","o":["正确","错误"],"kp":"信息架构评估方法的组合使用","an":"卡片分类法主要用于了解用户如何对内容分组，不能单独、唯一衡量所有用户的满意度。信息架构评估通常还需结合树测试、可用性测试、访谈和数据指标，因此B 正确。"},{"n":1292,"t":"judge","q":"简化的产品原型中包括识别前端和识别服务器两部分。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1293,"t":"judge","q":"某监控平台将请求量、错误率、响应时间和资源利用率进行量化统计，用于反映系统健康状况。这属于指标监控。","o":["正确","错误"],"kp":"指标监控","an":"请求量、错误率、响应时间和资源利用率都属于可量化的系统指标，通过持续统计这些指标可反映系统健康状况，因此A 正确。"},{"n":1294,"t":"judge","q":"局部二值模式是提取局部特征作为判别依据的，它显著的优点是对光照不敏感。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1295,"t":"judge","q":"某产品上线后用户群体和使用习惯持续变化，但团队认为用户画像首次建立后即可长期使用，无需更新。","o":["正确","错误"],"kp":"用户画像的动态更新","an":"用户群体、行为习惯和业务环境会持续变化，用户画像需要通过行为数据、反馈和调研定期更新。首次建立后长期不变会导致画像失真，因此B 正确。"},{"n":1296,"t":"judge","q":"人脸识别的特征数据量较大，在提取特征数据之后要进行降维，这样可以在一定程度上减少数据量。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1297,"t":"judge","q":"人脸识别算法在没有用户协作的环境中仍然不能很好地处理局部人脸。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1298,"t":"judge","q":"人脸检测是指对于任意一幅给定的图像，采用一定的策略对其进行搜索以确定其中是否含有人脸。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1299,"t":"judge","q":"一个完整的人脸识别系统包含三大主要组成部分，即人脸检测、人脸配准以及人脸识别。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1300,"t":"judge","q":"某企业维护设计系统时，只更新组件样式，不记录版本、变更内容和兼容范围，并认为版本管理不是规范管理的必要内容。","o":["正确","错误"],"kp":"设计系统的版本管理","an":"设计系统会随产品和技术持续变化，需要记录版本号、变更内容、发布时间和兼容范围，便于团队升级、追溯和协同。因此只更新样式而不进行版本管理的做法错误。"},{"n":1301,"t":"judge","q":"一般的人脸属性识别算法的输入是“一张人脸图”和“人脸五官关键点坐标”，输出是人脸相应的属性值。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1302,"t":"judge","q":"人脸特征提取不是人脸识别过程中必要的一个步骤。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1303,"t":"judge","q":"某指标近似服从稳定分布，团队使用均值上下3 个标准差作为异常范围。3σ原则是常用阈值设定方法之一。","o":["正确","错误"],"kp":"异常检测与告警阈值设置的策略","an":"当数据近似稳定且接近正态分布时，均值上下3 个标准差可作为常用异常范围，因此3σ原则属于常见阈值设定方法，A 正确。"},{"n":1304,"t":"judge","q":"某产品经理将任务分析概括为任务分解、步骤排序和效率评估，并认为完成这三项即可覆盖完整任务分析过程。","o":["正确","错误"],"kp":"任务分析的完整内容","an":"任务分析除任务分解、步骤排序和效率评估外，还应识别用户目标、前置条件、所需信息、决策点、异常情况和痛点等。认为三项内容即可覆盖完整过程，表述不完整，因此B 正确。"},{"n":1305,"t":"judge","q":"人脸比对是衡量不同人脸之间相似度的算法。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1306,"t":"judge","q":"物体识别是计算机视觉领域中的一项基础研究。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1307,"t":"judge","q":"物体识别两类算法上，Two‑Stage 算法在准确度上有优势，而One‑Stage算法在速度上有优势。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1308,"t":"judge","q":"某平台使用动态阈值后，认为误报将被完全消除，不再需要规则校准和人工复核。","o":["正确","错误"],"kp":"异常检测与告警阈值设置的策略","an":"动态阈值能够适应周期和趋势变化，但仍可能因模型偏差、数据漂移和异常场景不足产生误报，需要持续校准和复核，因此题干说法错误，B 正确。"},{"n":1309,"t":"judge","q":"零样本下的物体检测是零样本学习方法在图像分类的运用迁移到物体检测任务。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1310,"t":"judge","q":"图像分割就是把图像分成若干个特定的、具有独特性质的区域并提出感兴趣目标的技术和过程。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1311,"t":"judge","q":"RCNN 算法不能处理图像的大量区域。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1312,"t":"judge","q":"目标识别要求指出目标特性的具体数值，如形体、表面粗糙度和介电常数等。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1313,"t":"judge","q":"某设计组织使用统一检查清单逐项核对按钮状态、页面跳转、错误提示和无障碍要求。该清单属于规范检查的常用工具。","o":["正确","错误"],"kp":"交互规范检查清单","an":"统一检查清单可以将按钮状态、页面跳转、错误提示和无障碍要求等规范转化为可逐项核对的项目，是交互规范检查中常用的标准化工具，因此题干说法正确。"},{"n":1314,"t":"judge","q":"人工智能通过自动学习和医生的诊疗技术，分析和识别医疗影像上的病变，推荐医疗方案，协助医生诊断。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1315,"t":"judge","q":"医学影像是疾病筛查和诊断、治疗决策的最主要的信息来源。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1316,"t":"judge","q":"某医疗挂号系统进行规范检查时，评审人员首先核对预约、取消和支付逻辑是否符合用户已有认知和操作习惯。","o":["正确","错误"],"kp":"交互规范中的认知一致性","an":"预约、取消和支付等操作应符合用户已有认知和常见操作习惯，以降低学习成本和误操作风险。评审首先核对这些逻辑是否符合用户预期，属于合理的规范检查，因此题干说法正确。"},{"n":1317,"t":"judge","q":"机器视觉技术在医学疾病诊断方面的应用主要体现在两个方面，图像增强、标记和利用专家知识和3D 重构对物体三维信息与运动参数进行分析并给出形象准确的解释。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1318,"t":"judge","q":"需求承诺是指开发方和客户方的责任人对通过了同行评审的需求阶段的工作产品作出承诺，同时该承诺具有商业合同的同等效果。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1319,"t":"judge","q":"某车载系统开展可用性测试时，在模拟驾驶环境中设置导航、语音和紧急操作任务，以接近真实使用场景。","o":["正确","错误"],"kp":"可用性测试场景真实性","an":"车载系统的使用受到驾驶注意力、道路环境和任务紧迫性影响。在模拟驾驶环境中设置真实任务能够提高测试的情境真实性，因此题干说法正确。"},{"n":1320,"t":"judge","q":"设计和试制新产品的主要目的之一，是为了满足市场不断变化的需求，以获得更好的经济效益。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1321,"t":"judge","q":"某设计团队编写组件文档时，只记录尺寸和颜色，认为无需说明组件适用场景、使用限制和禁忌。","o":["正确","错误"],"kp":"组件文档的完整性要求","an":"组件文档除尺寸、颜色等视觉属性外，还应说明适用场景、使用方法、交互状态、限制条件和禁忌，才能指导设计与开发正确使用。因此无需说明使用边界的说法错误。"},{"n":1322,"t":"judge","q":"某业务数据分布随季节和用户群体变化，团队据此动态调整测试数据集的更新频率。","o":["正确","错误"],"kp":"测试数据集构建、管理与更新的方法","an":"当数据分布随季节和用户群体变化时，应根据变化速度和影响程度调整测试集更新频率，以保持代表性，因此A 正确。"},{"n":1323,"t":"judge","q":"某告警阈值设置过高，只有极端异常才会触发。该设置会降低系统识别真实异常的灵敏度。","o":["正确","错误"],"kp":"异常检测与告警阈值设置的策略","an":"阈值过高会使中等程度但真实的异常无法触发告警，从而降低检测灵敏度并增加漏报，因此A 正确。"},{"n":1324,"t":"judge","q":"对新产品设计方案进行分析比较，着重研究确定产品的合理性能及通过不同结构原理和系统的比较分析，从中选出最佳方案。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1325,"t":"judge","q":"某企业对延迟、错误率、交易量和库存量使用完全相同的告警阈值标准，不考虑指标量纲和业务含义。","o":["正确","错误"],"kp":"异常检测与告警阈值设置的策略","an":"不同指标的量纲、波动规律和业务含义不同，不能使用完全相同的阈值标准，因此题干做法错误，B 正确。"},{"n":1326,"t":"judge","q":"某跨端应用的视觉风格保持一致，但移动端与网页端的确认、返回和手势逻辑完全不同。团队仍认为已实现多端一致性。","o":["正确","错误"],"kp":"多端一致性的内涵","an":"多端一致性不仅包括视觉风格，还包括核心概念、操作逻辑、反馈方式和任务流程的一致。若确认、返回和手势逻辑完全不同，会增加学习和迁移成本，因此不能仅凭视觉一致认定已实现多端一致性。"},{"n":1327,"t":"judge","q":"工作图设计的目的是在技术设计的基础上完成生产及随机出厂用的全部工作图样和设计文件。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1328,"t":"judge","q":"标准化审查报告指产品工作图设计全部完成，工作图样和设计文件经标准化审查后，由标准化部门编写的文件。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1329,"t":"judge","q":"某订单系统使用状态流转图描述待付款、已付款、配送中和退款等正常状态。设计人员认为，该图不能呈现支付失败、库存不足等异常分支。","o":["正确","错误"],"kp":"状态流转图中的异常分支表达","an":"状态流转图既可以描述正常状态，也可以通过分支、事件和条件描述支付失败、库存不足等异常状态及其转换。因此“不能呈现异常分支”的说法错误，B 正确。"},{"n":1330,"t":"judge","q":"产品策划是产品实现产业化的核心。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1331,"t":"judge","q":"计算机辅助设计是运用计算机的能力来完成产品和工序的设计，其主要职能是设计制图。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1332,"t":"judge","q":"优化原则属于广义优化，包括方案择优、设计参数优化、总体方案优化。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1333,"t":"judge","q":"在概念开发与产品规划阶段，将有关市场机会、竞争力、技术可行性、生产需求的信息综合起来，确定新产品的框架。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1334,"t":"judge","q":"功能文档描述了用户使用产品必须完成的任务。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1335,"t":"judge","q":"某车载应用获取交互需求时，只询问用户希望增加什么功能，不分析驾驶、停车等具体使用场景。","o":["正确","错误"],"kp":"基于场景的交互需求获取","an":"交互需求不仅包括用户想增加的功能，还要分析用户在驾驶、停车等具体情境中的目标、限制和风险。只问功能而忽略场景，会导致需求不完整，因此B 正确。"},{"n":1336,"t":"judge","q":"家庭网关主要完成家庭内部网络各种不同通信协议之间的转换和信息共享。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1337,"t":"judge","q":"项目管理包括策划、进度计划和维护组成项目的活动的进展。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1338,"t":"judge","q":"各部门、各项目组之间的协调不利于组织项目培训工作。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1339,"t":"judge","q":"风险控制的目标是建立复杂的通道，尽量不让坏消息能传递到高层。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1340,"t":"judge","q":"矩阵结构是由三套管理系统组成的矩形组织结构。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1341,"t":"judge","q":"在项目申请书完成的同时，市场信息部门的所有部门都应密切注视该项目的进展情况，及时更新项目的最新状况。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1342,"t":"judge","q":"项目管理按“事件→项目→任务”的方式，“自上而下”地进行工作的部署，人员调动和资源分配。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1343,"t":"judge","q":"某订单表建立了大量重复和低选择性索引，导致新增订单和更新状态的耗时上升。数据库索引滥用可能降低写入性能。","o":["正确","错误"],"kp":"系统性能瓶颈分析与调优的方法","an":"重复索引和低选择性索引会增加插入、更新时维护索引结构的成本，并占用更多存储和缓存，因此可能降低写入性能，A 正确。"},{"n":1344,"t":"judge","q":"项目管理可以分成起始阶段，执行阶段和检测阶段。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1345,"t":"judge","q":"项目经理在项目管理中的主要工作是选择项目团队成员。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1346,"t":"judge","q":"人员激励是对项目成员工作成果的认可，可以让项目成员认识到自己工作的价值，从而激发项目成员的工作积极性和主动性。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1347,"t":"judge","q":"项目管理过程中的人力资源管理是为了保证所有项目关系人的能力和积极性都得到最有效地发挥和利用所做的一系列管理措施。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1348,"t":"judge","q":"人员激励也是项目管理中人力资源管理的重要内容，对人员的激励可以采用精神激励和物质激励。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1349,"t":"judge","q":"某团队在评审开始前一小时才提交原型和流程说明，并认为设计文档提交时间不会影响评审效率。","o":["正确","错误"],"kp":"交互评审前的材料准备","an":"原型和流程说明应在评审前提前提交，使评审人员有时间了解背景、发现问题并准备意见。临近评审才提交会降低讨论效率和质量，因此题干说法错误。"},{"n":1350,"t":"judge","q":"量化管理是人本管理，其有效性集中体现在以最少的资源投入，取得最大的合乎需求的产出，获得最佳的效率和效益。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1351,"t":"judge","q":"量化管理是根据工程学的原理设计而成的，其中的各个部分互相关联，互相制约，共同组合成一个有机的整体，使企业管理系统像一部精密的机器有效地运作。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1352,"t":"judge","q":"风险的主观性首先表现在它的存在是以个人的意志为转移的。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1353,"t":"judge","q":"风险识别是一次性行为。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1354,"t":"judge","q":"风险管理是一项系统性、综合性极强的工作，不仅其产生的原因复杂，而且后果影响面广，所需处理措施综合性强。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1355,"t":"judge","q":"转移风险是预防风险的第一要务。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1356,"t":"judge","q":"某支付链路健康度下降后，评估报告只发送给开发团队，不通知运营、客服和业务负责人。","o":["正确","错误"],"kp":"链路健康信息的跨部门共享","an":"关键链路健康度下降会影响业务运营、客户服务和风险处置，应及时向开发、运维、运营、客服及业务负责人共享信息。只通知开发团队不利于协同响应，因此B 正确。"},{"n":1357,"t":"judge","q":"在项目管理过程中，验收阶段是开始一个新项目的过程。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1358,"t":"judge","q":"某应用把启动、登录、任务执行、异常和退出等事件及状态写入记录文件。这属于日志可观测性方法。","o":["正确","错误"],"kp":"日志可观测性","an":"将应用启动、登录、任务执行、异常和退出等事件及状态写入记录文件，属于日志记录，可用于追踪运行过程和定位问题，因此A 正确。"},{"n":1359,"t":"judge","q":"在实施阶段中，项目经理应将项目按技术类别或按各部分完成的功能分成不同的子项目。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1360,"t":"judge","q":"培训计划编写主要应包括培训目的、培训对象、培训方式等内容。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1361,"t":"judge","q":"AI 训练结果的好坏与模型训练效率低并没有太大关系。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1362,"t":"judge","q":"智能系统与传统系统的又一个重要区别在于智能系统具有现场感应（环境适应） 的能力。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1363,"t":"judge","q":"在每次开始实验前，要建立一套可行方法，需要检查检测仪器的工作状态是否被改变或破坏。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1364,"t":"judge","q":"对于比较明确的规则，一般通过接口来测试，可以调用算法的接口或者直接调用服务端的接口。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1365,"t":"judge","q":"智能音箱不涉及的技术是语音识别。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1366,"t":"judge","q":"需求分为潜在需求和确定需求。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1367,"t":"judge","q":"根据数据处理空间的分布方式区分，有集中式处理方式和分布处理方式。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1368,"t":"judge","q":"某分布式请求依次经过多个服务，平台记录每个节点的时间和调用关系，以还原请求的完整流转路径。这属于链路追踪。","o":["正确","错误"],"kp":"分布式链路追踪","an":"记录分布式请求经过各服务节点的时间、调用关系和完整路径，能够还原请求流转过程，正是链路追踪的主要作用，因此A 正确。"},{"n":1369,"t":"judge","q":"在标注过程中，对于有遮挡的物体需要根据预测来判断这个物体被遮挡的地方，并根据预判进行标注。（ ）","o":["正确","错误"],"kp":"","an":""},{"n":1370,"t":"judge","q":"（ ）欧氏距离是计算欧几里得空间中两点之间的距离。","o":["正确","错误"],"kp":"","an":""},{"n":1371,"t":"judge","q":"某机器学习异常检测模型输出异常分数，团队认为无须设置任何阈值或决策规则即可自动产生准确告警。","o":["正确","错误"],"kp":"异常检测与告警阈值设置的策略","an":"异常分数只是模型输出，还需通过阈值或决策规则将连续分数转换为是否告警及告警级别，因此题干说法错误，B 正确。"},{"n":1372,"t":"judge","q":"某单位围绕突发事件场景召开桌面推演会议，参与者只讨论职责、流程和决策，不进行现场设备操作。","o":["正确","错误"],"kp":"桌面演练","an":"桌面演练以会议讨论、情景推演和职责决策为主，通常不进行现场设备操作。题干描述符合桌面演练特征，因此A 正确。"},{"n":1373,"t":"judge","q":"（ ）数据分析是有组织有目的地收集数据、分析数据，使之成为信息的过程。","o":["正确","错误"],"kp":"","an":""},{"n":1374,"t":"judge","q":"（ ）管理者识别需求要利用信息支持评审过程输入、过程输出、资源配置的合理性、过程活动的优化方案和过程异常变异的发现。","o":["正确","错误"],"kp":"","an":""},{"n":1375,"t":"judge","q":"（ ）数据分析模型优化目标函数是使全局损失函数最大。","o":["正确","错误"],"kp":"","an":""},{"n":1376,"t":"judge","q":"某企业按运维人员、开发人员和审计人员的岗位角色分配监控数据访问权限。采用RBAC 属于有效的权限管理方法。","o":["正确","错误"],"kp":"监控数据治理与权限管理的方法","an":"RBAC 按照岗位或角色统一分配权限，能够使运维、开发和审计人员仅获得与职责相符的访问范围，是常见且有效的权限管理方法，因此A 正确。"},{"n":1377,"t":"judge","q":"（ ）K 折交叉验证需要将数据集分成k 个互不相交的大小相同的数据集。","o":["正确","错误"],"kp":"","an":""},{"n":1378,"t":"judge","q":"（ ）两个变量的变化趋势相反时，两个变量之间的协方差是正值。","o":["正确","错误"],"kp":"","an":""},{"n":1379,"t":"judge","q":"（ ）标准差能反映一个数据集的离散程度。","o":["正确","错误"],"kp":"","an":""},{"n":1380,"t":"judge","q":"（ ）参数估计希望用较少的样本去描述数据的总体分布，可以不用事先知道样本的总体分布。","o":["正确","错误"],"kp":"","an":""},{"n":1381,"t":"judge","q":"（ ）线性回归包括简单线性回归和多元线性回归。","o":["正确","错误"],"kp":"","an":""},{"n":1382,"t":"judge","q":"某企业分析用户完成退款任务的全过程，重点识别材料难找、入口隐蔽和等待时间长等障碍。这符合任务分析的核心目标。","o":["正确","错误"],"kp":"任务分析的核心目标","an":"任务分析旨在理解用户如何完成任务，并识别步骤中的障碍、信息缺口和低效环节。题干定位材料难找、入口隐蔽和等待时间长等问题，符合这一核心目标，因此A 正确。"},{"n":1383,"t":"judge","q":"某测试平台定期从生产数据中自动抽取、清洗并更新测试样本，以减少人工操作。测试数据集更新可以通过自动化工具实现。","o":["正确","错误"],"kp":"测试数据集构建、管理与更新的方法","an":"通过工具定期完成生产数据抽取、清洗和样本更新，可以减少人工操作并保持测试集与业务变化同步，因此A 正确。"},{"n":1384,"t":"judge","q":"某健康服务平台设计“健康档案”“就医记录”等标签时，团队认为标签只需符合内部术语，无需考虑普通用户的语言习惯。","o":["正确","错误"],"kp":"信息标签的用户语言原则","an":"标签名称应符合目标用户的理解和表达习惯，减少内部术语造成的认知负担。只符合内部术语而不考虑普通用户语言，会降低信息可理解性，因此B正确。"},{"n":1385,"t":"judge","q":"（ ）逻辑回归主要解决分类问题，是一种预测分析。","o":["正确","错误"],"kp":"","an":""},{"n":1386,"t":"judge","q":"（ ）纵向对比是不同事物在固定时间上的对比。","o":["正确","错误"],"kp":"","an":""},{"n":1387,"t":"judge","q":"某在线学习平台绘制用户旅程时，只记录登录、选课和学习步骤，不记录焦虑、困惑或满意等情绪变化。","o":["正确","错误"],"kp":"用户旅程中的情绪要素","an":"用户旅程不仅记录操作步骤，还应关注用户在各阶段的感受、期望和情绪变化，以识别体验高点与痛点。只记录步骤而忽略情绪，旅程分析不完整，因此B 正确。"},{"n":1388,"t":"judge","q":"（ ）分组分析法与对比分析法的区别是分组分析法可以按照多个维度将数据拆分。","o":["正确","错误"],"kp":"","an":""},{"n":1389,"t":"judge","q":"（ ）预测分析法可以使用线性回归模型。","o":["正确","错误"],"kp":"","an":""},{"n":1390,"t":"judge","q":"（ ）漏斗分析法的目的是关于某事件在重要环节的转化率。","o":["正确","错误"],"kp":"","an":""},{"n":1391,"t":"judge","q":"（ ）AB 测试分析法是一种对比分析法。","o":["正确","错误"],"kp":"","an":""},{"n":1392,"t":"judge","q":"某企业组织跨部门功能演练，模拟核心系统中断并调动相关人员和资源。团队认为功能演练是最高级别、必须全面模拟真实事件的演练方式。","o":["正确","错误"],"kp":"功能演练的层级与特点","an":"功能演练通常针对某一应急功能或若干部门协同进行实战性检验，但并非最高级别，也不要求全面模拟所有真实事件。题干将其描述为最高级别且必须全面模拟，表述错误，因此B 正确。"},{"n":1393,"t":"judge","q":"（ ）通过t 检验推断两样本之间的均值是否存在差异。","o":["正确","错误"],"kp":"","an":""},{"n":1394,"t":"judge","q":"（ ）卡方检验用于验证两个数值型变量之间的独立性。","o":["正确","错误"],"kp":"","an":""},{"n":1395,"t":"judge","q":"（ ）泊松分布适合描述单位时间内随机发生的次数的概率分布。","o":["正确","错误"],"kp":"","an":""},{"n":1396,"t":"judge","q":"（ ）标准正态分布的数学期望为0，方差为1。","o":["正确","错误"],"kp":"","an":""},{"n":1397,"t":"judge","q":"某团队规定所有故障必须在固定一小时内找到根因，否则即违反所谓“黄金时间原则”。","o":["正确","错误"],"kp":"故障根因分析与定位的方法","an":"根因定位时长应根据故障复杂度、业务影响和证据获取情况确定，不存在适用于所有故障的固定一小时“黄金时间原则”，因此题干说法错误，B 正确。"},{"n":1398,"t":"judge","q":"（ ）贝叶斯定理是关于随机事件A 和B 的条件概率（或边缘概率）的一则定理。","o":["正确","错误"],"kp":"","an":""},{"n":1399,"t":"judge","q":"（ ）众数可以用来反映一组数据的一般情况和平均水平，也可以用它进行不同组数据的比较，以看出组与组之间的差别。","o":["正确","错误"],"kp":"","an":""},{"n":1400,"t":"judge","q":"（ ）为避免出现离均差总和为零，离均差平方和受样本含量的影响，统计学采用平均离均差平方和来描述变量的变异程度。","o":["正确","错误"],"kp":"","an":""},{"n":1401,"t":"judge","q":"（ ）数据决定了机器学习的上限，而软件只是尽可能逼近这个上限。","o":["正确",
