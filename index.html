<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b5bdb">
<!-- 单文件版：可直接双击打开，也可发给同学 -->
<title>人工智能训练师 · 理论自测练习</title>
<meta name="description" content="2026 年广东省人工智能与机器人技能大赛（人工智能训练师赛项）三套线上自测卷练习，含官方答案、随机出题、错题本与学习记录。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233b5bdb'/%3E%3Ctext x='32' y='44' font-size='30' font-family='Arial,Helvetica,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<style>

:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#0f172a; --ink-2:#475569; --ink-3:#94a3b8;
  --line:#e6eaf2; --brand:#3b5bdb; --brand-2:#5c7cfa; --brand-soft:#edf1ff;
  --ok:#16a34a; --ok-soft:#e8f7ee; --bad:#dc2626; --bad-soft:#fdeceb;
  --warn:#d97706; --warn-soft:#fff5e6; --radius:16px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  --shadow-lg:0 20px 50px rgba(15,23,42,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--brand);text-decoration:none}
::selection{background:#cfd9ff}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; backdrop-filter:blur(10px);
  background:rgba(255,255,255,.86); border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1180px; margin:0 auto; padding:10px 18px;
  display:flex; align-items:center; gap:14px; min-height:58px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;min-width:0;flex:1 1 auto}
.brand>div:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .logo{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--brand),#7c3aed);
  display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;
  box-shadow:0 4px 12px rgba(59,91,219,.35);
}
.brand small{display:block;font-weight:500;color:var(--ink-3);font-size:11px;letter-spacing:.4px}
.topbar .spacer{flex:0 0 auto}
.top-link{
  border:1px solid var(--line); background:#fff; color:var(--ink-2);
  padding:7px 12px; border-radius:10px; font-size:13px; display:inline-flex; gap:6px; align-items:center;
  transition:.15s; white-space:nowrap;
}
.top-link:hover{color:var(--brand);border-color:#c7d2fe;background:#f8faff}
.top-link.active{background:var(--brand-soft);border-color:#c7d2fe;color:var(--brand);font-weight:600}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 70px}
.view-enter{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- home ---------- */
.hero{
  position:relative; overflow:hidden; border-radius:22px; padding:30px 30px 26px;
  background:linear-gradient(120deg,#2b3fb8 0%,#3b5bdb 42%,#6d4bd8 100%);
  color:#fff; box-shadow:0 18px 40px rgba(43,63,184,.28);
}
.hero:after{
  content:""; position:absolute; right:-90px; top:-120px; width:320px; height:320px;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 62%); border-radius:50%;
}
.hero h1{margin:0 0 8px;font-size:26px;letter-spacing:.5px}
.hero p{margin:0;color:rgba(255,255,255,.82);font-size:13.5px}
.hero .hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.hero .chip{
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22);
  padding:6px 12px; border-radius:999px; font-size:12.5px; backdrop-filter:blur(4px);
}
.hero .hero-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.hero .btn-primary{background:#fff;color:#2b3fb8}
.hero .btn-primary:hover{background:#eef1ff}
.hero .btn-ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.hero .btn-ghost:hover{background:rgba(255,255,255,.22)}

.section-title{display:flex;align-items:baseline;gap:10px;margin:30px 2px 14px}
.section-title h2{margin:0;font-size:17px;letter-spacing:.3px}
.section-title span{color:var(--ink-3);font-size:12.5px}

.paper-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.paper-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);transition:.2s;display:flex;flex-direction:column;gap:14px;
  position:relative;overflow:hidden;
}
.paper-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#c7d2fe}
.paper-card .ribbon{
  position:absolute;top:14px;right:-32px;transform:rotate(38deg);
  background:var(--ok);color:#fff;font-size:11px;padding:4px 38px;letter-spacing:1px;
}
.paper-card h3{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.paper-card h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--brand)}
.paper-card .meta{color:var(--ink-3);font-size:12.5px;margin-top:-8px}
.paper-card .stat{
  display:flex;align-items:center;gap:12px;background:#f8faff;border:1px dashed #dbe3ff;
  padding:10px 12px;border-radius:12px;font-size:12.5px;color:var(--ink-2);
}
.paper-card .stat b{display:block;font-size:19px;color:var(--brand);font-weight:700;line-height:1.25}
.paper-card .stat span{font-size:11.5px;color:var(--ink-3)}
.paper-card .stat .sep{width:1px;height:26px;background:#dbe3ff}
.paper-card .ops{display:flex;gap:8px;margin-top:auto}
.paper-card .ops .btn{flex:1}

.btn{
  border:1px solid var(--line); background:#fff; color:var(--ink);
  padding:9px 14px; border-radius:11px; font-size:13.5px; font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:.16s; white-space:nowrap;
}
.btn:hover{border-color:#c7d2fe;background:#f8faff;color:var(--brand)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;
  box-shadow:0 6px 16px rgba(59,91,219,.28)}
.btn-primary:hover{background:#3450c9;border-color:#3450c9;color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.mini-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mini-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;cursor:pointer;transition:.18s;
}
.mini-card:hover{border-color:#c7d2fe;transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.mini-card .ico{
  width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:19px;
  background:var(--brand-soft);
}
.mini-card .ico.warn{background:var(--warn-soft)}
.mini-card .ico.ok{background:var(--ok-soft)}
.mini-card h4{margin:0;font-size:14.5px}
.mini-card p{margin:1px 0 0;color:var(--ink-3);font-size:12px}

.notice{
  display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;
  background:var(--warn-soft);border:1px solid #fde3bd;color:#8a5a10;font-size:12.8px;margin-top:16px;
}
.notice b{color:#7a4b06}
.notice.ok{background:#eefaf3;border-color:#bbf7d0;color:#0f7a3d}
.notice.ok b{color:#0b6b34}
.notice .x{margin-left:auto;background:none;border:0;color:#b07b2d;font-size:16px;line-height:1}

/* ---------- quiz ---------- */
.quiz-shell{padding-top:6px}
.quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.quiz-top .title{font-weight:700;font-size:16px}
.qtop-spacer{flex:1}
.qtop-actions{display:flex;gap:8px;align-items:center}
.tag{
  font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand);
  font-weight:700;letter-spacing:.3px;
}
.tag.gray{background:#eef1f7;color:var(--ink-2)}
.tag.judge{background:#eafaf0;color:#0f8a45}
.tag.multi{background:#fff1e6;color:#b45309}
.timer{
  margin-left:auto;display:flex;align-items:center;gap:7px;
  font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;color:var(--ink-2);
  background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:11px;box-shadow:var(--shadow);
}
.timer.warn{color:var(--bad);border-color:#fecaca;background:#fff5f5;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.62}}

.quiz-body{display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:18px;align-items:start}
.q-card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px 18px;
  box-shadow:var(--shadow);min-height:400px;
}
.q-head{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12.5px;margin-bottom:12px}
.q-head .num{color:var(--brand);font-weight:800;font-size:13px}
.q-head .fav{margin-left:auto;border:0;background:none;font-size:17px;line-height:1;color:#d7dce8;padding:2px}
.q-head .fav.on{color:#f59e0b}
.q-stem{
  font-size:17.5px;line-height:1.8;font-weight:600;color:#111827;margin:0 0 18px;
  white-space:pre-wrap;word-break:break-word;
}
.q-stem .blank{color:var(--brand)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:13px;
  border:1.5px solid var(--line);background:#fcfdff;cursor:pointer;transition:.14s;position:relative;
}
.opt:hover{border-color:#c7d2fe;background:#f6f9ff}
.opt .letter{
  width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
  font-size:13px;font-weight:800;background:#eef1f7;color:var(--ink-2);transition:.14s;
}
.opt .txt{flex:1;font-size:15px;color:#1f2937;word-break:break-word}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(59,91,219,.09)}
.opt.sel .letter{background:var(--brand);color:#fff}
.opt.correct{border-color:#86efac;background:var(--ok-soft)}
.opt.correct .letter{background:var(--ok);color:#fff}
.opt.wrong{border-color:#fca5a5;background:var(--bad-soft)}
.opt.wrong .letter{background:var(--bad);color:#fff}
.opt .mark{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ok);align-self:center}
.opt.wrong .mark{color:var(--bad)}

.feedback{
  margin-top:16px;border-radius:12px;padding:11px 14px;font-size:13.5px;display:flex;gap:8px;align-items:center;
  background:var(--ok-soft);color:#0f7a3d;border:1px solid #bbf7d0;
}
.feedback.bad{background:var(--bad-soft);color:#b91c1c;border-color:#fecaca}
.feedback.unknown{background:#eef2f7;color:var(--ink-2);border-color:#e2e8f0}

.q-foot{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:14px;border-top:1px dashed var(--line)}
.q-foot .spacer{flex:1}
.hint{color:var(--ink-3);font-size:12px}

/* answer card */
.side{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);
  position:sticky;top:76px;
}
.side h4{margin:0 0 10px;font-size:13.5px;display:flex;align-items:center;gap:6px}
.side h4 span{margin-left:auto;color:var(--ink-3);font-weight:500;font-size:12px}
.cards{display:block}
.card-group{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-bottom:14px}
.card-sep{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:11px;color:var(--ink-3);font-weight:600}
.card-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.cell{
  aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:#fbfcff;color:var(--ink-2);
  font-size:11.5px;font-weight:600;display:grid;place-items:center;padding:0;transition:.12s;
}
.cell:hover{border-color:var(--brand);color:var(--brand)}
.cell.done{background:var(--brand-soft);border-color:#c7d2fe;color:var(--brand)}
.cell.cur{outline:2px solid var(--brand);outline-offset:1px}
.cell.flag:after{
  content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--warn);
}
.cell{position:relative}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink-3)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.legend .l1{background:var(--brand-soft);border:1px solid #c7d2fe}
.legend .l2{background:#fff;border:1px solid var(--line)}
.legend .l3{background:var(--warn)}

.side .mini-info{display:flex;gap:8px;margin-top:14px;font-size:12px;color:var(--ink-2)}
.side .mini-info div{flex:1;background:#f8faff;border-radius:9px;padding:7px 8px;text-align:center}
.side .mini-info b{display:block;font-size:15px;color:var(--brand)}

/* ---------- result ---------- */
.result-hero{
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow);
  display:flex;gap:28px;align-items:center;flex-wrap:wrap;
}
.score-ring{position:relative;width:150px;height:150px;flex:none}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .val{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
}
.score-ring .val{flex-direction:column;display:flex;align-items:center;justify-content:center;gap:2px}
.score-ring .val b{font-size:36px;line-height:1;display:block;letter-spacing:-1px}
.score-ring .val span{font-size:11px;color:var(--ink-3)}
.result-main{flex:1;min-width:260px}
.result-main h1{margin:0 0 6px;font-size:22px}
.result-main .sub{color:var(--ink-3);font-size:13px}
.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.kpi{background:#f8faff;border:1px solid #e8edfb;border-radius:12px;padding:12px}
.kpi span{color:var(--ink-3);font-size:12px}
.kpi b{display:block;font-size:18px;margin-top:2px}

.review{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.rev-item{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  border-left:4px solid var(--ok);
}
.rev-item.bad{border-left-color:var(--bad)}
.rev-item .rh{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
.rev-item .rh .no{color:var(--ink);font-weight:700}
.rev-item .rs{font-size:14.5px;font-weight:600;margin-bottom:10px;white-space:pre-wrap}
.rev-item .ro{font-size:13.5px;color:var(--ink-2);margin:3px 0;display:flex;gap:8px}
.rev-item .ro b{font-weight:700;color:var(--ink)}
.ans-badge{font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:700}
.ans-badge.ok{background:var(--ok-soft);color:#0f7a3d}
.ans-badge.bad{background:var(--bad-soft);color:#b91c1c}
.ans-badge.mid{background:#eef2f7;color:var(--ink-2)}

/* ---------- misc ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 6px;font-size:17px}
.panel p.desc{color:var(--ink-2);font-size:13.5px;margin:0 0 16px}
textarea{
  width:100%;min-height:240px;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:ui-monospace,Consolas,monospace;
  font-size:13px;line-height:1.7;resize:vertical;background:#fcfdff;color:var(--ink);
}
textarea:focus{outline:none;border-color:#c7d2fe;box-shadow:0 0 0 3px rgba(59,91,219,.1)}
select{
  border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:13.5px;
}
.list{display:flex;flex-direction:column;gap:10px}
.row{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;
}
.row .grow{flex:1;min-width:0}
.row .qtext{font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .qsub{font-size:11.5px;color:var(--ink-3)}
.empty{text-align:center;color:var(--ink-3);padding:48px 0;font-size:13.5px}
.empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.7}

.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
  background:rgba(17,24,39,.94);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.24s;z-index:99;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.modal-mask{
  position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);z-index:60;
  display:grid;place-items:center;padding:20px;animation:fade .18s;
}
.modal{
  background:#fff;border-radius:18px;padding:24px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);
}
.modal h3{margin:0 0 8px;font-size:17px}
.modal p{margin:0 0 18px;color:var(--ink-2);font-size:13.5px;line-height:1.7}
.modal .acts{display:flex;gap:10px;justify-content:flex-end}

.drawer-btn{display:none}
@media (max-width:900px){
  .paper-grid,.mini-grid{grid-template-columns:1fr}
  .quiz-body{grid-template-columns:1fr}
  .side{
    position:fixed;right:0;top:0;bottom:0;width:300px;max-width:86vw;border-radius:0;z-index:50;
    transform:translateX(105%);transition:.24s;overflow:auto;padding-top:20px;box-shadow:-10px 0 40px rgba(15,23,42,.18);
  }
  .side.open{transform:none}
  .drawer-btn{display:inline-flex}
  .q-card{padding:18px 16px}
  .q-stem{font-size:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{padding:22px 18px}
  .hero h1{font-size:21px}
  .result-hero{gap:18px}
  .score-ring{width:120px;height:120px}
  .score-ring .val b{font-size:30px}
  .topbar-inner{padding:8px 10px;gap:6px;min-height:52px}
  .brand{gap:8px}
  .brand>div:last-child{font-size:12.5px}
  .brand small{display:none}
  .brand .logo{width:26px;height:26px;border-radius:8px;font-size:12px}
  .top-link{padding:6px 8px;font-size:12px;border-radius:9px}
  .cell{font-size:10.5px}
}
/* start dialog */
.start-modal{max-width:480px}
.start-sub{margin-bottom:2px}
.opt-row{display:flex;align-items:center;gap:12px;margin:16px 0}
.opt-row>label{width:62px;flex:none;color:var(--ink-2);font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 18px;font-size:13px;color:var(--ink-2);transition:.14s}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.checks{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink)}
.checks label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.start-note{font-size:12.5px;color:var(--ink-3);margin:14px 0 0}
.start-warn{font-size:12.5px;color:#9a5b04;background:var(--warn-soft);border:1px solid #fde3bd;border-radius:10px;padding:8px 10px;margin:12px 0 0}
.order-btn.on{background:var(--brand-soft);border-color:#c7d2fe;color:var(--brand)}

/* paper module picker */
.paper-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 6px}
.paper-title{font-size:20px;font-weight:700;letter-spacing:.3px}
.paper-tip{color:var(--ink-3);font-size:12.5px;margin:0 0 20px;line-height:1.7}
.mod-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mod-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:.18s}
.mod-card:hover{border-color:#c7d2fe;box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.mod-top{display:flex;align-items:baseline;gap:8px}
.mod-name{font-size:16.5px;font-weight:700}
.mod-count{color:var(--ink-3);font-size:12.5px;margin-left:auto}
.mod-bar{height:7px;background:#eef1f7;border-radius:99px;overflow:hidden}
.mod-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#7c3aed);border-radius:99px;transition:width .3s}
.mod-meta{color:var(--ink-2);font-size:12.5px}
.mod-ops{display:flex;gap:8px;margin-top:2px}
.mod-ops .btn{flex:1}
@media (max-width:760px){.mod-grid{grid-template-columns:1fr}}

/* history */
.his-row{gap:14px}
.his-score{width:66px;flex:none;text-align:center;border-right:1px dashed var(--line);padding-right:10px}
.his-score b{display:block;font-size:15px;color:var(--brand)}
.his-score span{font-size:11px;color:var(--ink-3)}
.his-pct{flex:none}
.his-title{font-size:13.5px}

.hidden{display:none!important}
.kbd-hint{opacity:.75}
@media (max-width:900px){.kbd-hint{display:none}}
@media (max-width:560px){
  .opt-row{flex-direction:column;align-items:flex-start;gap:7px;margin:13px 0}
  .opt-row>label{width:auto;font-size:12.5px}
  .checks{gap:14px}
  .quiz-top{gap:6px;row-gap:8px}
  .quiz-top .tag.gray{display:none}
  .quiz-top .title{font-size:14.5px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .quiz-top .timer{font-size:14.5px;padding:5px 9px}
  .qtop-actions{margin-left:auto}
  .order-btn{padding:5px 8px}
}

/* v2.1.0：卷卡片次级入口 + 列表题型筛选 */
.card-links{display:flex;gap:8px;align-items:center;margin-top:-6px;flex-wrap:wrap}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.fbtn{border:1px solid var(--line);background:#fff;color:var(--ink-2);padding:5px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:.15s}
.fbtn.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.fbtn:hover{border-color:#c7d2fe;color:var(--brand)}

/* v2.2.0：答题卡题型分组 */
@media (max-width:900px){
  .card-group{grid-template-columns:repeat(10,1fr)}
}
.his-review{flex:none;white-space:nowrap}
@media (max-width:560px){
  .his-review{font-size:11px;padding:5px 7px}
  .card-group{grid-template-columns:repeat(8,1fr);gap:4px}
}

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo">AI</div>
      <div>人工智能训练师 · 理论自测
        <small>2026 广东省人工智能与机器人技能大赛</small>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="top-link" data-nav="home">首页</button>
    <button class="top-link" data-nav="wrong">错题本 <span id="navWrong"></span></button>
    <button class="top-link" data-nav="key">答案管理</button>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<!-- ============ 首页 ============ -->
<template id="tpl-home">
  <section class="view-enter">
    <div class="hero">
      <h1>理论自测 · 三套模拟卷</h1>
      <p>2026年广东省人工智能与机器人技能大赛（人工智能训练师赛项）考前练习</p>
      <div class="hero-chips">
        <span class="chip">A / B / C 三套</span>
        <span class="chip">每套 100 题</span>
        <span class="chip">单选 60 · 多选 10 · 判断 30</span>
        <span class="chip">限时 90 分钟</span>
      </div>
      <div class="hero-actions">
        <button class="btn btn-primary" data-act="random-exam">全库随机练习（300 题）</button>
        <button class="btn btn-ghost" data-act="open-wrong">错题重练</button>
      </div>
    </div>
    <div class="notice ok" id="notice">
      <span>✅</span>
      <div><b>答案已核对官方：</b>三套共 300 题的答案，均按问卷星交卷结果页逐题校准（2026-10-26），与官方判分一致。如考务组后续调整答案，可在「答案管理」中粘贴覆盖。</div>
    </div>
    <div class="section-title"><h2>选择试卷</h2><span>建议先做一套完整模拟，再针对性刷错题</span></div>
    <div class="paper-grid" id="paperGrid"></div>
    <div class="section-title"><h2>专项练习</h2><span>跨卷混合 · 不占正式进度</span></div>
    <div class="mini-grid" id="miniGrid"></div>
    <div class="section-title"><h2>学习概况</h2><span>数据保存在本机浏览器 · <a href="javascript:;" data-act="open-history">查看学习记录 →</a></span></div>
    <div class="kpis" id="homeKpis"></div>
  </section>
</template>

<template id="tpl-paper-card">
  <article class="paper-card">
    <h3><span class="dot"></span><span class="p-title"></span></h3>
    <div class="meta">100 题 · 90 分钟 · 满分 100</div>
    <div class="stat">
      <div><b class="p-score">—</b><span>最高分</span></div>
      <div class="sep"></div>
      <div><b class="p-done">0</b><span>已答</span></div>
    </div>
    <div class="ops">
      <button class="btn btn-primary" data-act="card-exam">开始考试</button>
      <button class="btn" data-act="card-practice">练习模式</button>
    </div>
    <div class="card-links">
      <button class="btn btn-sm btn-ghost p-modules" data-act="card-modules">按题型练习 →</button>
      <button class="btn btn-sm btn-ghost p-resume hidden" data-act="card-resume">继续上次作答</button>
    </div>
  </article>
</template>

<template id="tpl-kpi">
  <div class="kpi"><span></span><b></b></div>
</template>

<!-- ============ 题型模块 ============ -->
<template id="tpl-paper">
  <section class="view-enter">
    <div class="paper-head">
      <button class="btn btn-sm btn-ghost" data-act="paper-back">← 返回</button>
      <div class="paper-title" id="paperTitle"></div>
      <div class="seg" id="paperMode">
        <button type="button" data-mode="exam">考试</button>
        <button type="button" data-mode="practice">练习</button>
      </div>
    </div>
    <p class="paper-tip">先选题型模块。进入答题后，点顶部「顺序 / 随机」就能随时切换——比如进「多选题」模块再点随机，只打乱多选题。</p>
    <div class="mod-grid" id="modList"></div>
  </section>
</template>

<template id="tpl-mod-card">
  <div class="mod-card">
    <div class="mod-top">
      <span class="mod-name"></span>
      <span class="mod-count"></span>
    </div>
    <div class="mod-bar"><i></i></div>
    <div class="mod-meta"></div>
    <div class="mod-ops">
      <button class="btn btn-primary btn-sm" data-act="mod-start">开始</button>
      <button class="btn btn-sm" data-act="mod-redo">重做</button>
    </div>
  </div>
</template>

<!-- ============ 答题 ============ -->
<template id="tpl-quiz">
  <section class="quiz-shell view-enter">
    <div class="quiz-top">
      <button class="btn btn-sm btn-ghost" data-act="exit">← 返回</button>
      <div class="title" id="qTitle"></div>
      <span class="tag gray" id="qModeTag"></span>
      <button class="btn btn-sm order-btn" data-act="order-toggle" id="btnOrder" title="切换出题顺序">顺序</button>
      <span class="qtop-spacer"></span>
      <div class="timer" id="timer"><span>⏱</span><span id="timerText">90:00</span></div>
      <div class="qtop-actions">
        <button class="btn btn-sm drawer-btn" data-act="toggle-card">答题卡</button>
        <button class="btn btn-primary btn-sm" data-act="submit">交卷</button>
      </div>
    </div>
    <div class="quiz-body">
      <div class="q-card">
        <div class="q-head">
          <span class="num" id="qNo"></span>
          <span class="tag" id="qType"></span>
          <span id="qHint"></span>
          <button class="fav" data-act="fav" title="收藏本题">☆</button>
        </div>
        <h2 class="q-stem" id="qStem"></h2>
        <div class="opts" id="qOpts"></div>
        <div class="feedback hidden" id="qFeedback"></div>
        <div class="q-foot">
          <button class="btn btn-sm" data-act="confirm-multi" id="btnConfirmMulti">确认作答</button>
          <button class="btn btn-sm" data-act="mark" id="btnMark">标记</button>
          <button class="btn btn-sm" data-act="clear" id="btnClear">清空本题</button>
          <span class="hint kbd-hint">键盘：A–D 选择 · ← → 切题</span>
          <span class="spacer"></span>
          <button class="btn btn-sm" data-act="prev">上一题</button>
          <button class="btn btn-primary btn-sm" data-act="next">下一题</button>
        </div>
      </div>
      <aside class="side" id="sideCard">
        <h4>答题卡 <span id="cardProgress"></span></h4>
        <div class="cards" id="cards"></div>
        <div class="legend">
          <span><i class="l1"></i>已答</span>
          <span><i class="l2"></i>未答</span>
          <span><i class="l3"></i>标记</span>
        </div>
        <div class="mini-info">
          <div><b id="infoDone">0</b>已答</div>
          <div><b id="infoFlag">0</b>标记</div>
          <div><b id="infoLeft">100</b>未答</div>
        </div>
      </aside>
    </div>
  </section>
</template>

<template id="tpl-option">
  <div class="opt" data-letter="">
    <span class="letter"></span>
    <span class="txt"></span>
    <span class="mark"></span>
  </div>
</template>

<template id="tpl-cell">
  <button class="cell" data-idx=""></button>
</template>

<!-- ============ 结果 ============ -->
<template id="tpl-result">
  <section class="view-enter">
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 150 150" width="100%" height="100%">
          <circle cx="75" cy="75" r="64" fill="none" stroke="#eef1f7" stroke-width="12"></circle>
          <circle id="ring" cx="75" cy="75" r="64" fill="none" stroke="#3b5bdb" stroke-width="12"
                  stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="402"></circle>
        </svg>
        <div class="val"><b id="scoreVal">0</b><span id="scoreOf">得分</span></div>
      </div>
      <div class="result-main">
        <h1 id="resTitle">交卷完成</h1>
        <div class="sub" id="resSub"></div>
        <div class="result-actions">
          <button class="btn btn-primary" data-act="retry">重做本卷</button>
          <button class="btn" data-act="to-paper">换个题型</button>
          <button class="btn" data-act="to-wrong">去错题本</button>
          <button class="btn" data-act="home">返回首页</button>
        </div>
      </div>
    </div>
    <div class="kpis" id="resKpis"></div>
    <div class="section-title">
      <h2>逐题回顾</h2>
      <span id="revToggle" style="cursor:pointer;color:var(--brand)">只看错题</span>
    </div>
    <div class="review" id="review"></div>
  </section>
</template>

<template id="tpl-review">
  <div class="rev-item">
    <div class="rh"><span class="no"></span><span class="tag"></span><span class="badge-wrap"></span></div>
    <div class="rs"></div>
    <div class="ro ro-my"><b>你的答案：</b><span></span></div>
    <div class="ro ro-ck"><b>参考答案：</b><span></span></div>
  </div>
</template>

<!-- ============ 列表（错题/收藏） ============ -->
<template id="tpl-list">
  <section class="view-enter">
    <div class="panel">
      <h2 id="listTitle"></h2>
      <p class="desc" id="listDesc"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        <button class="btn btn-primary" data-act="list-practice">开始重练</button>
        <button class="btn" data-act="list-clear">清空列表</button>
      </div>
      <div class="list" id="listBody"></div>
    </div>
  </section>
</template>

<template id="tpl-row">
  <div class="row">
    <span class="tag"></span>
    <div class="grow">
      <div class="qtext"></div>
      <div class="qsub"></div>
    </div>
    <button class="btn btn-sm btn-ghost" data-act="row-go">查看</button>
    <button class="btn btn-sm btn-ghost" data-act="row-del">移除</button>
  </div>
</template>

<!-- ============ 学习记录 ============ -->
<template id="tpl-history">
  <section class="view-enter">
    <div class="panel">
      <h2>学习记录</h2>
      <p class="desc" id="hisDesc"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        <button class="btn btn-sm" data-act="his-export">导出记录（JSON）</button>
        <button class="btn btn-sm" data-act="his-clear" style="color:var(--bad)">清空记录</button>
      </div>
      <div class="list" id="hisList"></div>
    </div>
  </section>
</template>

<template id="tpl-his-row">
  <div class="row his-row">
    <div class="his-score"><b></b><span></span></div>
    <div class="grow">
      <div class="qtext his-title"></div>
      <div class="qsub his-meta"></div>
    </div>
    <span class="ans-badge mid his-pct"></span>
    <button class="btn btn-sm btn-ghost his-review hidden" data-act="his-review">回顾错题</button>
  </div>
</template>

<!-- ============ 答案管理 ============ -->
<template id="tpl-key">
  <section class="view-enter">
    <div class="panel">
      <h2>答案管理</h2>
      <p class="desc">
        这里可以批量修正标准答案（例如按问卷星交卷后显示的官方答案）。格式：每行「题号 答案」，如 <b>1 D</b>、<b>12 AB</b>；
        也支持 <b>1D</b>、<b>1、D</b> 或用逗号、分号分隔。保存后所有成绩、错题会按新答案重算。
      </p>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
        <select id="keyPaper">
          <option value="A">自测卷 A</option>
          <option value="B">自测卷 B</option>
          <option value="C">自测卷 C</option>
        </select>
        <button class="btn btn-sm" data-act="key-load">载入当前答案</button>
        <button class="btn btn-sm" data-act="key-reset">恢复默认答案</button>
        <span class="hint" id="keyStat"></span>
      </div>
      <textarea id="keyText" spellcheck="false" placeholder="1 D&#10;2 B&#10;3 A"></textarea>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
        <button class="btn btn-primary" data-act="key-apply">保存并重新计分</button>
        <button class="btn" data-act="key-export">导出全部答案（JSON）</button>
        <button class="btn" data-act="key-import">导入答案（JSON）</button>
        <button class="btn" data-act="key-reset-all" style="margin-left:auto;color:var(--bad)">重置全部进度</button>
      </div>
      <p class="desc" style="margin-top:16px;margin-bottom:0">
        <b>提示：</b>「恢复默认答案」只会清除你手动修改过的题目，回到页面自带答案。
      </p>
    </div>
  </section>
</template>

<template id="tpl-modal">
  <div class="modal-mask">
    <div class="modal">
      <h3></h3>
      <p></p>
      <div class="acts">
        <button class="btn" data-act="modal-cancel">取消</button>
        <button class="btn btn-primary" data-act="modal-ok">确定</button>
      </div>
    </div>
  </div>
</template>

    try { d = JSON.parse(window.localStorage.getItem(LS) || 'null'); } catch (e) { d = null; }
    if (!d || typeof d !== 'object') d = {};
    d.papers = d.papers || {};
    d.wrong = d.wrong || {};
    d.fav = d.fav || {};
    d.overrides = d.overrides || {};
    d.history = d.history || [];
    d.settings = d.settings || {};
    return d;
  }
  var db = readDB();
  var memOnly = false;
  function save() {
    if (memOnly) return;
    try { window.localStorage.setItem(LS, JSON.stringify(db)); }
    catch (e) { memOnly = true; }
  }
  function pstate(pid) {
    var s = db.papers[pid];
    if (!s) {
      s = { answers: {}, flags: {}, sessions: {} };
      db.papers[pid] = s;
    }
    if (!s.sessions) {
      // v1 -> v2 迁移：原来的整卷状态变成 sessions.all
      var sessions = {};
      if (s.order || s.mode || (s.answers && Object.keys(s.answers).length)) {
        sessions.all = {
          idx: s.idx || 0, mode: s.mode || 'practice', order: s.order || null,
          random: !!s.random, done: !!s.done, score: (s.score == null ? null : s.score),
          total: s.total || 0, used: s.used || 0, deadline: s.deadline || 0, at: 0
        };
      }
      s.sessions = sessions;
      delete s.idx; delete s.mode; delete s.done; delete s.score; delete s.used;
      delete s.deadline; delete s.types; delete s.random; delete s.order; delete s.total;
    }
    return s;
  }

  function modState(pid, mod) {
    var s = pstate(pid);
    var ms = s.sessions[mod];
    if (!ms) {
      ms = { idx: 0, mode: '', order: null, random: false, done: false, score: null,
             total: 0, used: 0, deadline: 0, at: 0 };
      s.sessions[mod] = ms;
    }
    return ms;
  }

  function moduleQuestions(p, mod) {
    if (mod === 'all') return p.questions.slice();
    return p.questions.filter(function (q) { return q.t === mod; });
  }

  function modLabel(mod) {
    return mod === 'all' ? '整套模拟' : typeLabel(mod);
  }

  function examLimit(n) {
    return Math.max(300, Math.round(EXAM_SECONDS * n / 100));
  }

  /* 清空某模块（按题型）已答答案与标记，并重置该模块会话 */
  function clearModuleAnswers(p, mod) {
    var st = pstate(p.id);
    moduleQuestions(p, mod).forEach(function (q) {
      delete st.answers[q.key];
      delete st.flags[q.key];
    });
    if (st.sessions[mod]) {
      var ms = st.sessions[mod];
      ms.order = null; ms.idx = 0; ms.done = false; ms.score = null; ms.total = 0;
      ms.used = 0; ms.deadline = 0; ms.random = false; ms.at = 0;
    }
    save();
  }

  /* 清空整卷已答答案与标记，并重置全部模块会话 */
  function clearPaperAnswers(pid) {
    var st = pstate(pid);
    Object.keys(st.answers).forEach(function (k) { delete st.answers[k]; });
    Object.keys(st.flags).forEach(function (k) { delete st.flags[k]; });
    Object.keys(st.sessions).forEach(function (m) {
      var ms = st.sessions[m];
      ms.order = null; ms.idx = 0; ms.done = false; ms.score = null; ms.total = 0;
      ms.used = 0; ms.deadline = 0; ms.random = false; ms.at = 0;
    });
    save();
  }

  /* 重做某模块：确认后清空本模块已答再重新开始 */
  function redoModule(pid, mod, mode, random) {
    var p = BY_ID[pid];
    showModal('重做本模块？', '将清空「' + modLabel(mod) + '」的已答答案与标记（错题本、收藏、历史成绩保留），然后重新开始。', '重做', function () {
      clearModuleAnswers(p, mod);
      beginSession(pid, mod, mode, { fresh: true, random: !!random });
    }, '取消');
  }

  function moduleAnswered(pid, mod) {
    var p = BY_ID[pid], s = db.papers[pid];
    if (!p || !s) return 0;
    var n = 0;
    moduleQuestions(p, mod).forEach(function (q) { if (s.answers[q.key]) n++; });
    return n;
  }

  /* ---------------- utils ---------------- */
  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function cloneTpl(id) {
    return document.getElementById(id).content.firstElementChild.cloneNode(true);
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1900);
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return pad2(m) + ':' + pad2(s);
  }
  function fmtUsed(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m > 0 ? m + ' 分 ' + s + ' 秒' : s + ' 秒';
  }
  function letterAt(i) { return 'ABCDEFGH'.charAt(i); }
  function sortedLetters(str) {
    return (str || '').toUpperCase().split('').filter(function (c, i, a) { return 'ABCDEFGH'.indexOf(c) >= 0 && a.indexOf(c) === i; }).sort().join('');
  }
  function correctOf(q) {
    var ov = db.overrides[q.pid];
    if (ov && ov[q.n]) return sortedLetters(ov[q.n]);
    var k = KEY[q.pid];
    return k && k[q.n] ? sortedLetters(k[q.n]) : '';
  }
  function typeName(t) { return t === 'multi' ? '多选题' : (t === 'judge' ? '判断题' : '单选题'); }
  function typeTagClass(t) { return t === 'multi' ? 'tag multi' : (t === 'judge' ? 'tag judge' : 'tag'); }

  /* ---------------- modal ---------------- */
  function showModal(title, text, okText, onOk, cancelText, onCancel) {
    var m = cloneTpl('tpl-modal');
    $('.modal h3', m).textContent = title;
    $('.modal p', m).textContent = text;
    $('.modal .btn-primary', m).textContent = okText || '确定';
    $('.modal .btn:not(.btn-primary)', m).textContent = cancelText || '取消';
    var root = document.getElementById('modalRoot');
    root.appendChild(m);
    function close() { if (m.parentNode) m.parentNode.removeChild(m); }
    m.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) { if (e.target === m) close(); return; }
      var act = b.getAttribute('data-act');
      if (act === 'modal-ok') { close(); if (onOk) onOk(); }
      else if (act === 'modal-cancel') { close(); if (onCancel) onCancel(); }
    });
    return close;
  }

  /* ---------------- state ---------------- */
  var route = 'home';
  var pick = { pid: null, mode: 'exam' };
  var sess = null;
  var lastResult = null;
  var revOnlyWrong = false;
  var tickTimer = null;
  var reviewH = null;

  function cur() { return sess.qs[sess.idx]; }

  /* ---------------- session ---------------- */
  function enterQuiz(pid, mod, mode, st, ms, list) {
    var p = BY_ID[pid];
    sess = {
      pid: pid, mod: mod, title: p.title + ' · ' + modLabel(mod),
      mode: mode, qs: list, answers: st.answers, flags: st.flags,
      idx: Math.min(ms.idx || 0, list.length - 1),
      st: st, ms: ms, persist: true, startAt: Date.now(), pending: {},
      deadline: mode === 'exam' ? ms.deadline : 0, limit: examLimit(list.length),
      random: !!ms.random, done: false
    };
    route = 'quiz';
    render();
  }

  function beginSession(pid, mod, mode, cfg) {
    var p = BY_ID[pid];
    var st = pstate(pid);
    var ms = modState(pid, mod);
    cfg = cfg || {};
    var fresh = cfg.fresh || !ms.order;
    if (fresh) {
      var qs = moduleQuestions(p, mod);
      if (cfg.random) shuffle(qs);
      ms.order = qs.map(function (q) { return q.key; });
      ms.total = qs.length;
      ms.idx = 0;
      ms.done = false;
      ms.score = null;
      ms.used = 0;
      ms.mode = mode;
      ms.random = !!cfg.random;
      ms.deadline = mode === 'exam' ? Date.now() + examLimit(qs.length) * 1000 : 0;
      ms.at = Date.now();
    } else {
      if (!ms.total) ms.total = ms.order.length;
      ms.mode = mode;
      if (mode !== 'exam') {
        ms.deadline = 0;
      } else if (!ms.deadline) {
        ms.deadline = Date.now() + examLimit(ms.total) * 1000;
      } else if (ms.deadline < Date.now()) {
        // 考试超时续做：弹窗选择，不再进入后立即自动交卷
        showModal('上次考试已超时', '作答已保存，但考试时间已过。可「重新计时继续」（保留已答，重新给足考试时长），或「重做本卷」（清空本模块已答后重新开始）。',
          '重新计时继续', function () {
            ms.deadline = Date.now() + examLimit(ms.total || ms.order.length) * 1000;
            ms.mode = mode;
            var list = ms.order.map(function (k) { return QMAP[k]; }).filter(Boolean);
            enterQuiz(pid, mod, mode, st, ms, list);
          }, '重做本卷', function () {
            clearModuleAnswers(p, mod);
            beginSession(pid, mod, mode, { fresh: true, random: cfg.random });
          });
        return;
      }
    }
    var list = ms.order.map(function (k) { return QMAP[k]; }).filter(Boolean);
    if (!list.length) {
      list = moduleQuestions(p, mod);
      ms.order = list.map(function (q) { return q.key; });
      ms.total = list.length;
    }
    enterQuiz(pid, mod, mode, st, ms, list);
  }

  function beginSet(qs, title, mode, random, persistOpt) {
    if (random) shuffle(qs);
    sess = {
      pid: null, mod: null, title: title, mode: mode, qs: qs,
      answers: {}, flags: {}, idx: 0, st: null, ms: null,
      persist: !!persistOpt, startAt: Date.now(), pending: {},
      deadline: mode === 'exam' ? Date.now() + Math.max(600, qs.length * 54) * 1000 : 0,
      limit: Math.max(600, qs.length * 54), done: false,
      random: !!random
    };
    route = 'quiz';
    render();
  }

  function applyOrder(randomize) {
    if (!sess) return;
    var head = sess.qs.slice(0, sess.idx + 1);
    var tail = sess.qs.slice(sess.idx + 1);
    if (randomize) shuffle(tail); else tail.sort(byPaperNo);
    sess.qs = head.concat(tail);
    sess.random = randomize;
    if (sess.persist && sess.ms) {
      sess.ms.order = sess.qs.map(function (q) { return q.key; });
      sess.ms.random = randomize;
      save();
    }
    render();
    toast(randomize ? '已切换：后面的题随机出' : '已切换：后面的题按顺序出');
  }

  function openPaper(pid, mode) {
    pick.pid = pid;
    pick.mode = mode || 'exam';
    route = 'paper';
    render();
  }

  function remainingSec() {
    if (!sess || !sess.deadline) return 0;
    return Math.max(0, Math.ceil((sess.deadline - Date.now()) / 1000));
  }
  function usedSec() {
    if (!sess) return 0;
    if (sess.mode === 'exam' && sess.deadline) return Math.min(sess.limit || EXAM_SECONDS, (sess.limit || EXAM_SECONDS) - remainingSec());
    return (Date.now() - sess.startAt) / 1000;
  }

  function persistPos() {
    if (sess && sess.persist && sess.ms) { sess.ms.idx = sess.idx; sess.ms.at = Date.now(); save(); }
  }

  /* ---------------- scoring ---------------- */
  function evaluate(s) {
    var stat = { single: [0, 0], multi: [0, 0], judge: [0, 0] };
    var score = 0, unknown = 0, blank = 0, wrong = [];
    s.qs.forEach(function (q) {
      var c = correctOf(q), a = s.answers[q.key] || '';
      stat[q.t][1]++;
      if (!c) { unknown++; return; }
      if (a === c) { score++; stat[q.t][0]++; }
      else { if (!a) blank++; else wrong.push(q); }
    });
    return { score: score, stat: stat, unknown: unknown, blank: blank, wrong: wrong, total: s.qs.length };
  }

  function addWrong(q) {
    if (!db.wrong[q.key]) { db.wrong[q.key] = { pid: q.pid, n: q.n, at: Date.now() }; save(); }
  }
  function removeWrong(q) {
    if (db.wrong[q.key]) { delete db.wrong[q.key]; save(); }
  }

  /* 某次练习记录中答错的题（key 数组）；基于答题快照与当前答案计算 */
  function wrongKeysOf(h) {
    if (!h || !h.snap) return [];
    var out = [];
    Object.keys(h.snap).forEach(function (k) {
      var q = QMAP[k];
      var c = q ? correctOf(q) : null;
      if (c && h.snap[k] !== c) out.push(k);
    });
    return out;
  }

  /* ---------------- timer ---------------- */
  function tick() {
    if (route !== 'quiz' || !sess) return;
    var t = document.getElementById('timerText');
    if (!t) return;
    var exam = sess.mode === 'exam';
    var sec = exam ? remainingSec() : (Date.now() - sess.startAt) / 1000;
    t.textContent = fmtClock(sec);
    var box = document.getElementById('timer');
    if (box) box.classList.toggle('warn', exam && sec <= 300);
    if (exam && sess.deadline && sec <= 0 && !sess.done) {
      sess.done = true;
      evaluateAndFinish(true);
    }
  }

  /* ---------------- render root ---------------- */

    var node;
    if (route === 'home') node = viewHome();
    else if (route === 'quiz') node = viewQuiz();
    else if (route === 'result') node = viewResult();
    else if (route === 'wrong') node = viewList('wrong');
    else if (route === 'fav') node = viewList('fav');

    else if (route === 'history') node = viewHistory();

    app.appendChild(node);

    if (btnOrder) {
      btnOrder.textContent = sess.random ? '随机' : '顺序';
      btnOrder.classList.toggle('on', !!sess.random);
      btnOrder.title = sess.random ? '当前随机出题，点击改为顺序' : '当前按题号顺序，点击改为随机';
      btnOrder.addEventListener('click', function () { applyOrder(!sess.random); });
    }

    var opts = $('#qOpts', node);
    var cells = $('#cards', node);

    function rebuildQuestion() {
      var q = cur();
      opts.innerHTML = '';
      q.o.forEach(function (txt, i) {
        var o = cloneTpl('tpl-option');
        o.setAttribute('data-letter', letterAt(i));
        $('.letter', o).textContent = letterAt(i);
        $('.txt', o).textContent = txt;
        o.addEventListener('click', function () { choose(i); });
        opts.appendChild(o);
      });
      $('#qNo', node).textContent = '第 ' + (sess.idx + 1) + ' / ' + sess.qs.length + ' 题';
      $('#qType', node).textContent = typeName(q.t);
      $('#qType', node).className = typeTagClass(q.t);
      $('#qHint', node).textContent = q.t === 'multi' ? '（多选，全对才得分）' : '';
      $('#qStem', node).textContent = q.q;
      var fav = $('[data-act="fav"]', node);
      fav.textContent = db.fav[q.key] ? '★' : '☆';
      fav.classList.toggle('on', !!db.fav[q.key]);
      paintOptions();
      paintCard();
      paintFeedback();
      tick();
    }

    // build answer card once —— 按题型固定分组（单选→多选→判断），cell 用 data-idx 对应题序
    var buckets = { single: [], multi: [], judge: [] };
    sess.qs.forEach(function (q, i) { buckets[q.t].push(i); });
    ['single', 'multi', 'judge'].forEach(function (t) {
      if (!buckets[t].length) return;
      cells.appendChild(el('div', 'card-sep', typeName(t)));
      var group = el('div', 'card-group');
      buckets[t].forEach(function (i) {
        var c = cloneTpl('tpl-cell');
        c.textContent = String(sess.qs[i].n);
        c.setAttribute('data-idx', String(i));
        c.addEventListener('click', function () {
          sess.idx = i; persistPos();
          rebuildQuestion();
          var side = $('#sideCard', node);
          if (side) side.classList.remove('open');
        });
        group.appendChild(c);
      });
      cells.appendChild(group);
    });

    function pendingOf(q) {
      if (!sess.pending) sess.pending = {};
      if (sess.pending[q.key] == null) sess.pending[q.key] = sortedLetters(sess.answers[q.key] || '');
      return sess.pending[q.key];
    }

    function choose(i) {
      var q = cur();
      var L = letterAt(i);
      if (q.t === 'multi') {
        var next = pendingOf(q);
        next = next.indexOf(L) >= 0 ? next.replace(L, '') : sortedLetters(next + L);
        if (sess.mode === 'practice' && sess.answers[q.key]) { toast('本题已作答，可「清空本题」后重选'); return; }
        sess.pending[q.key] = next;
        if (sess.mode === 'exam') {
          setAnswer(q, next);
        }
        paintOptions();
        paintCard();
        return;
      }
      if (sess.mode === 'practice' && sess.answers[q.key]) { toast('本题已作答，可「清空本题」后重选'); return; }
      setAnswer(q, L);
      if (sess.mode === 'practice') {
        var c = correctOf(q);
        if (c && L === c) { removeWrong(q); } else if (c) { addWrong(q); }
      }
      paintOptions();
      paintCard();
      paintFeedback();
    }

    function setAnswer(q, v) {
      if (v) sess.answers[q.key] = sortedLetters(v);
      else delete sess.answers[q.key];
      if (sess.persist) save();
    }

    function paintOptions() {
      var q = cur();
      var a = sess.answers[q.key] || '';
      var c = correctOf(q);
      var showKey = sess.mode === 'practice' && !!a;
      var pending = (sess.mode === 'practice' && q.t === 'multi') ? pendingOf(q) : a;
      $all('.opt', opts).forEach(function (o) {
        var L = o.getAttribute('data-letter');
        var sel = (sess.mode === 'practice' && q.t === 'multi' && !a ? pending : a).indexOf(L) >= 0;
        o.classList.toggle('sel', sel);
        o.classList.toggle('correct', showKey && c.indexOf(L) >= 0);
        o.classList.toggle('wrong', showKey && sel && c.indexOf(L) < 0);
        var mk = $('.mark', o);
        if (showKey && c.indexOf(L) >= 0) mk.textContent = '正确答案';
        else if (showKey && sel) mk.textContent = '你的选择';
        else mk.textContent = '';
      });
      var b = $('[data-act="confirm-multi"]', node);
      var needConfirm = sess.mode === 'practice' && q.t === 'multi' && !sess.answers[q.key];
      b.classList.toggle('hidden', !needConfirm);
    }

    function paintFeedback() {
      var box = $('#qFeedback', node);
      var q = cur();
      var a = sess.answers[q.key] || '';
      if (sess.mode !== 'practice' || !a) { box.classList.add('hidden'); return; }
      var c = correctOf(q);
      box.classList.remove('hidden');
      box.className = 'feedback';
      if (!c) {
        box.classList.add('unknown');
        box.textContent = '本题尚未收录参考答案，可在「答案管理」中补充。';
      } else if (a === c) {
        box.textContent = '✓ 回答正确';
      } else {
        box.classList.add('bad');
        var txt = '✗ 回答错误，正确答案：' + c.split('').join(' ');
        box.textContent = txt;
      }
    }

    function paintCard() {
      var cellsArr = $all('.cell', cells);
      var byIdx = {};
      cellsArr.forEach(function (c) { byIdx[parseInt(c.getAttribute('data-idx'), 10)] = c; });
      var done = 0, flag = 0;
      sess.qs.forEach(function (q, i) {
        var cell = byIdx[i];
        if (!cell) return;
        var d = !!sess.answers[q.key];
        if (d) done++;
        if (sess.flags[q.key]) flag++;
        cell.classList.toggle('done', d);
        cell.classList.toggle('flag', !!sess.flags[q.key]);
        cell.classList.toggle('cur', i === sess.idx);
      });
      $('#infoDone', node).textContent = String(done);
      $('#infoFlag', node).textContent = String(flag);
      $('#infoLeft', node).textContent = String(sess.qs.length - done);
      $('#cardProgress', node).textContent = done + '/' + sess.qs.length;
    }

    // footer buttons
    $('[data-act="prev"]', node).addEventListener('click', function () {
      if (sess.idx > 0) { sess.idx--; persistPos(); rebuildQuestion(); }
    });
    $('[data-act="next"]', node).addEventListener('click', function () {
      if (sess.idx < sess.qs.length - 1) { sess.idx++; persistPos(); rebuildQuestion(); }
      else toast('已经是最后一题了');
    });
    $('[data-act="mark"]', node).addEventListener('click', function () {
      var q = cur();
      sess.flags[q.key] = !sess.flags[q.key];
      if (sess.persist) save();
      paintCard();
      toast(sess.flags[q.key] ? '已标记，稍后可在答题卡查看' : '已取消标记');
    });
    $('[data-act="clear"]', node).addEventListener('click', function () {
      var q = cur();
      delete sess.answers[q.key];
      if (sess.pending) delete sess.pending[q.key];
      if (sess.persist) save();
      paintOptions(); paintCard(); paintFeedback();
    });
    $('[data-act="fav"]', node).addEventListener('click', function () {
      var q = cur();
      if (db.fav[q.key]) delete db.fav[q.key];
      else db.fav[q.key] = { pid: q.pid, n: q.n, at: Date.now() };
      save(); rebuildQuestion();
    });
    $('[data-act="confirm-multi"]', node).addEventListener('click', function () {
      var q = cur();
      var v = pendingOf(q);
      if (!v) { toast('请先选择至少一个选项'); return; }
      setAnswer(q, v);
      var c = correctOf(q);
      if (c && v === c) removeWrong(q); else if (c) addWrong(q);
      paintOptions(); paintCard(); paintFeedback();
    });
    $('[data-act="toggle-card"]', node).addEventListener('click', function () {
      $('#sideCard', node).classList.toggle('open');
    });
    $('[data-act="submit"]', node).addEventListener('click', function () { confirmSubmit(); });
    $('[data-act="exit"]', node).addEventListener('click', function () {
      var answered = Object.keys(sess.answers).length;
      var pid = sess.pid, mode = sess.mode;
      function leave() {
        persistPos();
        sess = null;
        if (pid) { pick.pid = pid; pick.mode = mode; route = 'paper'; }
        else route = 'home';
        render();
      }
      if (answered && !sess.done) {
        showModal('暂时离开？', '作答进度会保存，下次点「继续」接着做。', '离开', leave, '继续答题');
      } else leave();
    });

    rebuildQuestion();
    return node;
  }

  function confirmSubmit() {
    var unanswered = sess.qs.filter(function (q) { return !sess.answers[q.key]; }).length;
    var msg = '共 ' + sess.qs.length + ' 题，已答 ' + (sess.qs.length - unanswered) + ' 题';
    if (unanswered) msg += '，还有 ' + unanswered + ' 题未作答（按错处理）';
    msg += '。交卷后即可查看答案与解析。';
    showModal('确认交卷？', msg, '交卷', function () { evaluateAndFinish(false); });
  }

  function evaluateAndFinish(auto) {
    var s = sess;
    var r = evaluate(s);
    var used = usedSec();
    if (s.persist && s.ms) {
      s.ms.done = true;
      s.ms.score = r.score;
      s.ms.total = r.total;
      s.ms.used = Math.round(used);
      s.ms.idx = s.idx;
      s.ms.at = Date.now();
    }
    s.qs.forEach(function (q) {
      var c = correctOf(q), a = s.answers[q.key] || '';
      if (!c || !a) return;
      if (a === c) removeWrong(q); else addWrong(q);
    });
    if (s.persist) {
      var snap = {};
      s.qs.forEach(function (q) { if (s.answers[q.key]) snap[q.key] = s.answers[q.key]; });
      db.history.push({
        pid: s.pid, mod: s.mod || null, mode: s.mode, score: r.score, total: r.total,
        at: Date.now(), used: Math.round(used), random: !!s.random, snap: snap
      });
      if (db.history.length > 200) db.history = db.history.slice(-200);
      save();
    }
    lastResult = { sess: s, r: r, used: used };
    revOnlyWrong = false;
    route = 'result';
    render();
    if (auto) toast('时间到，已自动交卷');
  }

  /* ---------------- result ---------------- */
  function viewResult() {
    var node = cloneTpl('tpl-result');
    var s = lastResult.sess, r = lastResult.r;
    var pct = r.total ? r.score / r.total : 0;

    $('#scoreVal', node).textContent = String(r.score);
    $('#scoreOf', node).textContent = '得分 / ' + r.total;
    $('#resTitle', node).textContent = s.mode === 'exam' ? '交卷完成' : '练习完成';
    var praise = pct >= 0.9 ? '状态非常好，保持手感。' : pct >= 0.75 ? '基础扎实，重点补错题。' : pct >= 0.6 ? '还有提升空间，建议按章节重刷。' : '建议先过一遍错题，再重做本卷。';
    $('#resSub', node).textContent = s.title + ' · 用时 ' + fmtUsed(lastResult.used) + ' · 正确率 ' + Math.round(pct * 100) + '%　' + praise;

    var ring = $('#ring', node);
    var C = 2 * Math.PI * 64;
    ring.setAttribute('stroke-dasharray', String(C));
    ring.setAttribute('stroke-dashoffset', String(C));
    var color = pct >= 0.8 ? '#16a34a' : pct >= 0.6 ? '#3b5bdb' : '#dc2626';
    ring.setAttribute('stroke', color);
    setTimeout(function () {
      ring.style.transition = 'stroke-dashoffset 1s cubic-bezier(.2,.8,.3,1)';
      ring.setAttribute('stroke-dashoffset', String(C * (1 - pct)));
    }, 60);

    var kpis = $('#resKpis', node);
    var kpiList = [['用时', fmtUsed(lastResult.used)]];
    TYPES.forEach(function (t) {
      if (r.stat[t][1] > 0) kpiList.push([typeLabel(t), r.stat[t][0] + ' / ' + r.stat[t][1]]);
    });
    kpiList.forEach(function (x) {
      var k = cloneTpl('tpl-kpi');
      $('span', k).textContent = x[0];
      $('b', k).textContent = x[1];
      kpis.appendChild(k);
    });

    var revBox = $('#review', node);
    var toggle = $('#revToggle', node);
    function paintReview() {
      revBox.innerHTML = '';
      var list = s.qs.filter(function (q) {
        if (!revOnlyWrong) return true;
        var c = correctOf(q), a = s.answers[q.key] || '';
        return !c || a !== c;
      });
      if (!list.length) { revBox.appendChild(el('div', 'empty', '没有需要回顾的题目 🎉')); return; }
      list.forEach(function (q) {
        var item = cloneTpl('tpl-review');
        var c = correctOf(q), a = s.answers[q.key] || '';
        var ok = c && a === c;
        item.classList.toggle('bad', !ok);
        $('.no', item).textContent = q.pid + ' 卷 第 ' + q.n + ' 题';
        var tag = $('.tag', item);
        tag.textContent = typeName(q.t);
        tag.className = typeTagClass(q.t);
        var badge = el('span', 'ans-badge ' + (ok ? 'ok' : (c ? 'bad' : 'mid')), ok ? '答对' : (c ? (a ? '答错' : '未作答') : '未收录答案'));
        $('.badge-wrap', item).appendChild(badge);
        $('.rs', item).textContent = q.q;
        $('.ro-my span', item).textContent = a ? a.split('').join(' ') : '未作答';
        $('.ro-ck span', item).textContent = c ? c.split('').join(' ') : '—';
        revBox.appendChild(item);
      });
      toggle.textContent = revOnlyWrong ? '显示全部' : '只看错题';
    }
    paintReview();
    toggle.addEventListener('click', function () { revOnlyWrong = !revOnlyWrong; paintReview(); });

    $('[data-act="retry"]', node).addEventListener('click', function () {
      if (s.persist && s.pid) redoModule(s.pid, s.mod || 'all', s.mode, s.random);
      else beginSet(s.qs.map(function (q) { return q; }), s.title, s.mode, s.random);
    });
    $('[data-act="to-paper"]', node).addEventListener('click', function () {
      if (s.pid) { pick.pid = s.pid; pick.mode = s.mode; route = 'paper'; render(); }
      else { route = 'home'; render(); }
    });
    $('[data-act="to-wrong"]', node).addEventListener('click', function () { route = 'wrong'; render(); });
    $('[data-act="home"]', node).addEventListener('click', function () { route = 'home'; render(); });
    return node;
  }

  /* ---------------- lists ---------------- */
  function viewList(kind) {
    var node = cloneTpl('tpl-list');
    var map = kind === 'wrong' ? db.wrong : db.fav;
    var title = kind === 'wrong' ? '错题本' : '我的收藏';
    $('#listTitle', node).textContent = title;
    var desc = $('#listDesc', node);
    var body = $('#listBody', node);
    var filter = 'all';
    var reviewMode = false;

    function allQs() {
      return Object.keys(map).sort(function (a, b) { return (map[b].at || 0) - (map[a].at || 0); })
        .map(function (k) { return ALL.filter(function (x) { return x.key === k; })[0]; })
        .filter(Boolean);
    }
    function visibleQs() {
      var arr = allQs();
      if (filter !== 'all') arr = arr.filter(function (q) { return q.t === filter; });
      return arr;
    }
    function fmtDate(t) {
      var d = new Date(t || Date.now());
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
        ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }
    function reviewRows() {
      var items = db.history.slice().reverse();
      if (!items.length) {
        body.appendChild(el('div', 'empty', '还没有练习记录，做完一套卷子后这里就能回顾 📚'));
        return;
      }
      items.forEach(function (h) {
        var row = el('div', 'row');
        var left = el('div', 'grow');
        left.appendChild(el('div', 'qtext', (h.pid && BY_ID[h.pid] ? BY_ID[h.pid].title : '混合练习') +
          ' · ' + (h.mod ? modLabel(h.mod) : '混合') + ' · ' + (h.mode === 'exam' ? '考试' : '练习')));
        left.appendChild(el('div', 'qsub', fmtDate(h.at) + ' · 得分 ' + h.score + '/' + (h.total || 100) +
          ' · 用时 ' + fmtUsed(h.used || 0) + (h.random ? ' · 随机' : '')));
        row.appendChild(left);
        if (h.snap) {
          var n = wrongKeysOf(h).length;
          var btn = el('button', 'btn btn-sm btn-ghost', '错题 ' + n + ' 道 →');
          btn.addEventListener('click', function () { reviewH = h; route = 'review'; render(); });
          row.appendChild(btn);
        } else {
          row.appendChild(el('span', 'hint', '无快照，不可回顾'));
        }
        body.appendChild(row);
      });
    }
    function paint() {
      body.innerHTML = '';
      if (reviewMode) {
        desc.textContent = '按交卷顺序回顾每一次练习的错题（带快照的练习才可回顾）。';
        reviewRows();
        return;
      }
      desc.textContent = kind === 'wrong'
        ? '共 ' + allQs().length + ' 道。答对后会自动移出；也可手动移除。每次交卷的错题可在上方「练习回顾」按次查看。'
        : '共 ' + allQs().length + ' 道。收藏的题目可以随时回看。';
      var qs = visibleQs();
      if (!qs.length) {
        body.appendChild(el('div', 'empty', kind === 'wrong'
          ? (filter === 'all' ? '还没有错题，去刷一套卷子吧 📚' : '该题型下没有错题')
          : (filter === 'all' ? '还没有收藏，点题目右上角 ☆ 收藏' : '该题型下没有收藏')));
      }
      qs.forEach(function (q) {
        var row = cloneTpl('tpl-row');
        var tag = $('.tag', row);
        tag.textContent = typeName(q.t);
        tag.className = typeTagClass(q.t);
        $('.qtext', row).textContent = q.pid + ' 卷 第 ' + q.n + ' 题 · ' + q.q;
        var c = correctOf(q);
        $('.qsub', row).textContent = c ? ('参考答案：' + c.split('').join(' ')) : '答案未收录';
        $('[data-act="row-go"]', row).addEventListener('click', function () {
          beginSet([q], q.pid + ' 卷 第 ' + q.n + ' 题', 'practice');
        });
        $('[data-act="row-del"]', row).addEventListener('click', function () {
          delete map[q.key]; save(); paint();
        });
        body.appendChild(row);
      });
    }

    var filterRow = el('div', 'filter-row');
    [['all', '全部'], ['single', '单选'], ['multi', '多选'], ['judge', '判断']].forEach(function (f) {
      var b = el('button', 'fbtn' + (f[0] === 'all' ? ' on' : ''), f[1]);
      b.addEventListener('click', function () {
        filter = f[0];
        $all('.fbtn', filterRow).forEach(function (x) { x.classList.toggle('on', x === b); });
        paint();
      });
      filterRow.appendChild(b);
    });
    $('.panel', node).insertBefore(filterRow, body);

    if (kind === 'wrong') {
      var tabRow = el('div', 'filter-row');
      var tCur = el('button', 'fbtn on', '当前错题');
      var tRev = el('button', 'fbtn', '练习回顾');
      tCur.addEventListener('click', function () {
        reviewMode = false;
        tCur.classList.add('on'); tRev.classList.remove('on');
        filterRow.style.display = '';
        paint();
      });
      tRev.addEventListener('click', function () {
        reviewMode = true;
        tRev.classList.add('on'); tCur.classList.remove('on');
        filterRow.style.display = 'none';
        paint();
      });
      tabRow.appendChild(tCur); tabRow.appendChild(tRev);
      $('.panel', node).insertBefore(tabRow, filterRow);
    }

    $('[data-act="list-practice"]', node).addEventListener('click', function () {
      var qs = visibleQs();
      if (!qs.length) { toast('列表是空的'); return; }
      beginSet(qs, title + ' · 重练', 'practice');
    });
    $('[data-act="list-clear"]', node).addEventListener('click', function () {
      if (!allQs().length) return;
      showModal('清空' + title + '？', '该操作不可撤销。', '清空', function () {
        allQs().forEach(function (q) { delete map[q.key]; });
        save(); paint();
      });
    });
    paint();
    return node;
  }

  /* ---------------- 练习回顾：查看某一次练习的错题 ---------------- */
  function viewReview() {
    var node = cloneTpl('tpl-list');
    var h = reviewH || {};
    $('#listTitle', node).textContent = '练习回顾';
    var desc = $('#listDesc', node);
    var body = $('#listBody', node);
    var d = new Date(h.at || Date.now());
    var dateStr = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
      ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    desc.textContent = (h.pid && BY_ID[h.pid] ? BY_ID[h.pid].title : '混合练习') + ' · ' +
      (h.mod ? modLabel(h.mod) : '混合') + ' · ' + (h.mode === 'exam' ? '考试' : '练习') + ' · ' +
      dateStr + ' · 得分 ' + h.score + '/' + (h.total || 100) + ' · 用时 ' + fmtUsed(h.used || 0) +
      (h.random ? ' · 随机' : '');
    var keys = wrongKeysOf(h);

    var ops = el('div', 'filter-row');
    var b1 = el('button', 'btn btn-sm btn-primary', '重练本次错题（' + keys.length + ' 道）');
    b1.addEventListener('click', function () {
      if (!keys.length) { toast('这次没有错题'); return; }
      beginSet(keys.map(function (k) { return QMAP[k]; }).filter(Boolean), '练习回顾 · 错题重练', 'practice');
    });
    var b2 = el('button', 'btn btn-sm btn-ghost', '← 返回错题本');
    b2.addEventListener('click', function () { route = 'wrong'; render(); });
    ops.appendChild(b1); ops.appendChild(b2);
    $('.panel', node).insertBefore(ops, body);

    if (!keys.length) {
      body.appendChild(el('div', 'empty', '这次练习全对，没有错题 🎉'));
      return node;
    }
    keys.forEach(function (k) {
      var q = QMAP[k];
      if (!q) return;
      var row = cloneTpl('tpl-row');
      var tag = $('.tag', row);
      tag.textContent = typeName(q.t);
      tag.className = typeTagClass(q.t);
      $('.qtext', row).textContent = q.pid + ' 卷 第 ' + q.n + ' 题 · ' + q.q;
      var c = correctOf(q);
      $('.qsub', row).textContent = c ? ('参考答案：' + c.split('').join(' ')) : '答案未收录';
      $('[data-act="row-go"]', row).textContent = '重练';
      $('[data-act="row-go"]', row).addEventListener('click', function () {
        beginSet([q], q.pid + ' 卷 第 ' + q.n + ' 题', 'practice');
      });
      $('[data-act="row-del"]', row).textContent = '移除';
      $('[data-act="row-del"]', row).addEventListener('click', function () {
        if (db.wrong[k]) { delete db.wrong[k]; save(); }
        toast('已移出错题本');
      });
      body.appendChild(row);
    });
    return node;
  }

  /* ---------------- history ---------------- */
  function viewHistory() {
    var node = cloneTpl('tpl-history');
    var list = $('#hisList', node);
    var items = db.history.slice().reverse();
    $('#hisDesc', node).textContent = '共 ' + items.length + ' 条记录，保存在本机浏览器；换浏览器或清缓存会丢，可先导出备份。';
    if (!items.length) list.appendChild(el('div', 'empty', '还没有记录，做一套卷子就会自动保存 🎯'));
    items.forEach(function (h) {
      var total = h.total || 100;
      var pct = total ? Math.round(h.score / total * 100) : 0;
      var row = cloneTpl('tpl-his-row');
      $('.his-score b', row).textContent = h.score + '/' + total;
      $('.his-score span', row).textContent = '得分';
      var d = new Date(h.at);
      var dateStr = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
        ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
      $('.his-title', row).textContent = (h.pid && BY_ID[h.pid] ? BY_ID[h.pid].title : '混合练习') +
        ' · ' + (h.mod ? modLabel(h.mod) : '混合') + ' · ' + (h.mode === 'exam' ? '考试' : '练习');
      var meta = dateStr + ' · 用时 ' + fmtUsed(h.used || 0);
      if (h.random) meta += ' · 随机';
      if (!h.snap) meta += ' · 旧记录(改答案后不重算)';
      $('.his-meta', row).textContent = meta;
      var b = $('.his-pct', row);
      b.textContent = pct + '%';
      b.className = 'ans-badge ' + (pct >= 80 ? 'ok' : pct >= 60 ? 'mid' : 'bad') + ' his-pct';
      var rv = $('[data-act="his-review"]', row);
      if (h.snap) {
        rv.classList.remove('hidden');
        rv.textContent = '本次错题 ' + wrongKeysOf(h).length + ' 道 →';
        rv.addEventListener('click', function () { reviewH = h; route = 'review'; render(); });
      }
      list.appendChild(row);
    });
    $('[data-act="his-clear"]', node).addEventListener('click', function () {
      if (!db.history.length) { toast('还没有记录'); return; }
      showModal('清空学习记录？', '只清除这份记录列表，不影响各卷作答进度、错题本和收藏。', '清空', function () {
        db.history = []; save(); render(); toast('记录已清空');
      });
    });
    $('[data-act="his-export"]', node).addEventListener('click', function () {
      if (!db.history.length) { toast('还没有记录'); return; }
      var blob = new Blob([JSON.stringify(db.history, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '学习记录.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    });
    return node;
  }

  /* ---------------- key management ---------------- */
  function keyText(pid) {
    var p = BY_ID[pid];
    var lines = p.questions.map(function (q) {
      var c = correctOf(q);
      return q.n + ' ' + (c || '?');
    });
    return lines.join('\n');
  }

  function viewKey() {
    var node = cloneTpl('tpl-key');
    var sel = $('#keyPaper', node);
    var ta = $('#keyText', node);

    function refresh() {
      var pid = sel.value;
      ta.value = keyText(pid);
      var ov = db.overrides[pid] || {};
      var n = Object.keys(ov).length;
      $('#keyStat', node).textContent = n ? ('本卷已修改 ' + n + ' 题') : '本卷使用默认答案';
    }
    sel.addEventListener('change', refresh);

    $('[data-act="key-load"]', node).addEventListener('click', refresh);
    $('[data-act="key-reset"]', node).addEventListener('click', function () {
      var pid = sel.value;
      showModal('恢复默认答案？', '将清除你在 ' + pid + ' 卷手动修改的答案。', '恢复', function () {
        delete db.overrides[pid]; save(); refresh(); toast('已恢复默认答案');
      });
    });
    $('[data-act="key-apply"]', node).addEventListener('click', function () {
      var pid = sel.value;
      var raw = ta.value.replace(/[，、；;]/g, '\n');
      var count = 0, bad = 0;
      var ov = db.overrides[pid] = db.overrides[pid] || {};
      var base = KEY[pid] || {};
      raw.split(/\r?\n/).forEach(function (line) {
        var t = line.trim();
        if (!t) return;
        var m = t.match(/^(\d{1,3})\s*[\.:：\-]?\s*([A-Ha-h]+)$/) || t.match(/^(\d{1,3})\s+([A-Ha-h\s]+)$/);
        if (!m) { bad++; return; }
        var no = parseInt(m[1], 10);
        var ans = sortedLetters(m[2].replace(/\s/g, ''));
        var p = BY_ID[pid];
        if (!p || !p.questions.some(function (q) { return q.n === no; })) { bad++; return; }
        if (!ans) { bad++; return; }
        if (ans === sortedLetters(base[no] || '')) delete ov[no];
        else { ov[no] = ans; count++; }
      });
      // 按新答案重算有快照的历史记录得分
      var rescored = 0;
      db.history.forEach(function (h) {
        if (!h.snap || h.pid !== pid) return;
        var ok = 0, total = 0;
        Object.keys(h.snap).forEach(function (k) {
          var m = /^(\w)#(\d+)$/.exec(k);
          if (!m || m[1] !== pid) return;
          total++;
          if (correctOf({ pid: pid, n: parseInt(m[2], 10) }) === h.snap[k]) ok++;
        });
        if (total) { h.score = ok; h.total = total; rescored++; }
      });
      save();
      $('#keyStat', node).textContent = '本卷已修改 ' + Object.keys(ov).length + ' 题';
      toast('已更新 ' + count + ' 题' + (bad ? '，' + bad + ' 行无法识别' : '') + (rescored ? '，已重算 ' + rescored + ' 条历史成绩' : ''));
      if (lastResult && route === 'result') render();
    });
    $('[data-act="key-export"]', node).addEventListener('click', function () {
      var out = {};
      PAPERS.forEach(function (p) {
        out[p.id] = {};
        p.questions.forEach(function (q) { out[p.id][q.n] = correctOf(q); });
      });
      var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '答案导出.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    });
    $('[data-act="key-reset-all"]', node).addEventListener('click', function () {
      showModal('重置全部进度？', '将清空三套卷的作答记录、错题本、收藏与历史成绩（答案修改也会清除）。', '全部清空', function () {
        db.papers = {}; db.wrong = {}; db.fav = {}; db.history = []; db.overrides = {};
        save(); lastResult = null; refresh(); toast('已重置');
      });
    });
    $('[data-act="key-import"]', node).addEventListener('click', function () {
      var inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.json,application/json';
      inp.addEventListener('change', function () {
        var f = inp.files && inp.files[0];
        if (!f) return;
        var rd = new FileReader();
        rd.onload = function () {
          try {
            var data = JSON.parse(String(rd.result));
            var n = 0;
            Object.keys(data).forEach(function (pid) {
              if (!BY_ID[pid]) return;
              db.overrides[pid] = db.overrides[pid] || {};
              Object.keys(data[pid]).forEach(function (no) {
                var ans = sortedLetters(String(data[pid][no]));
                if (ans) { db.overrides[pid][no] = ans; n++; }
              });
            });
            save(); refresh(); toast('已导入 ' + n + ' 条答案');
          } catch (e) { toast('文件解析失败，请检查 JSON 格式'); }
        };
        rd.readAsText(f, 'utf-8');
      });
      inp.click();
    });

    refresh();
    return node;
  }

  /* ---------------- keyboard ---------------- */
  document.addEventListener('keydown', function (e) {
    if (route !== 'quiz' || !sess) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    var k = String(e.key || '').toUpperCase();
    if (k.length === 1 && 'ABCDEFGH'.indexOf(k) >= 0) {
      var q = cur();
      var i = 'ABCDEFGH'.indexOf(k);
      if (i < q.o.length) {
        e.preventDefault();
        var btns = $all('#qOpts .opt');
        if (btns[i]) btns[i].click();
      }
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      var nb = $('[data-act="next"]');
      if (nb) nb.click();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      var pb = $('[data-act="prev"]');
      if (pb) pb.click();
    } else if (e.key === 'Enter') {
      if ($('.modal-mask')) return;
      e.preventDefault();
      confirmSubmit();
    }
  });

  /* ---------------- top nav ---------------- */
  $all('.top-link').forEach(function (b) {
    b.addEventListener('click', function () {
      var nav = b.getAttribute('data-nav');
      if (nav === 'home') {
        if (route === 'quiz' && sess && Object.keys(sess.answers).length && !sess.done) {
          showModal('回到首页？', '本次作答进度会保存，稍后可继续。', '回到首页', function () {
            persistPos(); sess = null; route = 'home'; render();
          }, '继续答题');
          return;
        }
        sess = null;
        route = 'home';
      } else if (nav === 'wrong') { route = 'wrong'; }
      else if (nav === 'key') { route = 'key'; }
      render();
    });
  });

  document.addEventListener('click', function (e) {
    var side = document.getElementById('sideCard');
    if (!side || !side.classList.contains('open')) return;
    if (side.contains(e.target)) return;
    if (e.target.closest && e.target.closest('[data-act="toggle-card"]')) return;
    side.classList.remove('open');
  });

  window.addEventListener('beforeunload', function () { if (sess) persistPos(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && sess) persistPos();
  });

  /* ---------------- boot ---------------- */
  if (!PAPERS.length) {
    app.appendChild(el('div', 'empty', '题库数据未加载，请检查 data/questions.js 是否存在'));
  } else {
    render();
  }
})();

</script>
</body>
</html>
